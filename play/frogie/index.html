function bossUpdate(dt){
  if(!boss)return;
  if(boss.dead){
    boss.deadT+=dt;boss.group.position.y-=dt*0.9;boss.group.rotation.z+=dt*1.5;
    if(boss.deadT>1.6)bossClear();
    return;
  }
  boss.t+=dt;
  if(boss.flash>0)boss.flash=Math.max(0,boss.flash-dt);
  if(boss.intro>0)boss.intro-=dt;
  else if(boss.stun>0){boss.stun-=dt;boss.open=true;}
  else boss.def.update(boss,dt,{frog:frog,shoot:bossShoot,T:T});
  boss.crT=(boss.crT===undefined?2:boss.crT)-dt;if(boss.crT<=0&&boss.intro<=0){boss.crT=5;dropCrate();}
  boss.group.position.set(boss.x,boss.y,boss.z);
  boss.group.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive&&o.userData.flash)o.material.emissive.setHex(boss.flash>0?0xffffff:0x000000);});
  bossUpdateBar();
  // atılımla çarpma
  const dB=Math.hypot(frog.x-boss.x,frog.z-boss.z);
  if(frog.dashT>0&&dB<boss.r+0.4&&!boss.dashHit){boss.dashHit=1.0;bossHurt(boss.open?2:1);frog.dashT=0;frog.vx=frog.vz=0;}
  if(boss.dashHit)boss.dashHit=Math.max(0,boss.dashHit-dt);
  if(frog.invul<=0&&frog.y<0.8&&dB<boss.r*0.8&&boss.def.contact!==false)die('car');
  for(let i=bossProj.length-1;i>=0;i--){
    const p=bossProj[i];
    p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt;p.m.position.x=p.x;p.m.position.z=p.z;p.m.rotation.y+=dt*6;
    let rm=p.life<=0||Math.abs(p.x)>9||p.z>2;
    if(!rm&&frog.invul<=0&&frog.y<0.7&&Math.hypot(frog.x-p.x,frog.z-p.z)<p.r+0.24){die('car');rm=true;}
    if(rm){if(p.m.parent)p.m.parent.remove(p.m);bossProj.splice(i,1);}
  }
}

defBoss('croc',{
  hp:6,r:1.7,reward:200,phases:[0.66,0.33],
  build(g,H){
    const gm=H.mat(0x3f9a3a),dk=H.mat(0x2c7a2b),wh=H.mat(0xffffff),bk=H.mat(0x151515);
    const body=H.mk(H.box(3.4,1.1,2.2),gm,0,0.75,0,true,false);body.userData.flash=1;g.add(body);
    const back=H.mk(H.box(3.0,0.5,1.8),dk,0,1.4,-0.1,true,false);g.add(back);
    const jawU=H.mk(H.box(2.4,0.45,1.4),gm,0,1.15,1.6,true,false);jawU.userData.flash=1;g.add(jawU);
    const jawL=H.mk(H.box(2.3,0.35,1.3),dk,0,0.55,1.55,true,false);g.add(jawL);
    g.userData.jawU=jawU;g.userData.jawL=jawL;
    for(const s of [-1,1]){
      g.add(H.mk(H.sph(0.34,10,8),wh,s*0.85,1.75,0.7,true,false));
      g.add(H.mk(H.sph(0.17,8,6),bk,s*0.85,1.8,0.98,false,false));
      g.add(H.mk(H.box(0.3,0.5,0.3),dk,s*1.5,0.3,-0.5,true,false));
    }
    for(let i=0;i<5;i++)g.add(H.mk(H.box(0.12,0.3,0.12),wh,-0.9+i*0.45,0.82,2.25,false,false));
  },
  onPhase(b,ph){banner(t('boss_croc'),'×'+(ph+1));},
  update(b,dt,api){
    const ph=b.phase,spd=0.7+ph*0.35;
    b.x=Math.sin(b.t*spd)*3.6;
    // ağız döngüsü: 3.2sn'de bir 1.5sn açılır
    const cyc=3.6-ph*0.3,openT=2.3;
    b.open=(b.t%cyc)>cyc-openT;
    const g=b.group.userData;
    if(g.jawL)g.jawL.position.y+=((b.open?0.2:0.55)-g.jawL.position.y)*Math.min(1,dt*10);
    // ateş
    b.data.fire=(b.data.fire||0)-dt;
    if(b.data.fire<=0&&!b.open){
      b.data.fire=2.6-ph*0.4;
      const dx=api.frog.x-b.x,dz=api.frog.z-b.z,d=Math.hypot(dx,dz)||1,sp=3.2+ph*0.5;
      const n=ph>=2?2:1;
      for(let k=0;k<n;k++){
        const a=Math.atan2(dx,dz)+(k-(n-1)/2)*0.28;
        api.shoot(b.x,b.z+1.9,Math.sin(a)*sp,Math.cos(a)*sp,{color:0xff7a2a});
      }
      tone(240,140,0.15,'square',0.05);
    }
  }
});

function wheelPick(){let s=0;WSEG.forEach(x=>{s+=x.w;});let r=Math.random()*s;for(let i=0;i<WSEG.length;i++){r-=WSEG[i].w;if(r<0)return i;}return 0;}
function spinWheel(){
  if(wheelBusy)return;

  }else P.wheel.d=dstr(new Date());
  saveNow();updateWallet();

  const idx=wheelPick(),center=idx*45+22.5;

function stdBoss(b,dt,api,c){
  const ph=b.phase;
  b.x=Math.sin(b.t*(c.spd+ph*c.spdP))*c.amp;
  const cyc=c.cyc-ph*0.2;
  b.open=(b.t%cyc)>cyc-c.openT;
  b.data.fire=(b.data.fire||0)-dt;
  if(b.data.fire<=0&&(!b.open||c.fireOpen)){
    b.data.fire=c.every-ph*c.everyP;
    const dx=api.frog.x-b.x,dz=api.frog.z-b.z,base=Math.atan2(dx,dz),n=c.n+(ph>=1?c.nP:0),sp=c.sp+ph*0.4;
    for(let k=0;k<n;k++){
      const a=base+(k-(n-1)/2)*c.spread;
      api.shoot(b.x,b.z+1.9,Math.sin(a)*sp,Math.cos(a)*sp,{color:c.col,r:c.pr});
    }
    tone(c.tone,c.tone*0.55,0.15,'square',0.05);
  }
  if(c.extra)c.extra(b,dt,api);
}

const inkMat=new THREE.MeshBasicMaterial({color:0x0a0a14,side:THREE.BackSide});
function toonify(root,ink){
  const list=[];root.traverse(o=>{if(o.isMesh&&!o.userData.ink)list.push(o);});
  for(const m of list){
    const mt=m.material;
    if(mt&&mt.isMeshLambertMaterial){
      m.material=new THREE.MeshToonMaterial({color:mt.color.clone(),emissive:mt.emissive?mt.emissive.clone():new THREE.Color(0),gradientMap:toonGrad,transparent:mt.transparent,opacity:mt.opacity,depthWrite:mt.depthWrite});
    }
    if(ink&&mt&&!mt.transparent&&!m.userData.noInk){
      const o=new THREE.Mesh(m.geometry,inkMat);o.scale.setScalar(ink);o.userData.ink=1;m.add(o);
    }
  }
}

function updateParticles(g,dt){
  const a=g.userData.pts.geometry.attributes.position,m=g.userData.mode;
  for(let i=0;i<a.count;i++){
    let x=a.getX(i),y=a.getY(i),z=a.getZ(i);
    if(m==='fall'){y-=dt*1.4;x+=Math.sin(sT*1.3+i)*dt*0.4;if(y<0)y=10;}
    else if(m==='rise'){y+=dt*(1+(i%5)*0.3);x+=Math.sin(sT+i)*dt*0.3;if(y>10)y=0;}
    else if(m==='drift'){x+=dt*(2+(i%4));y+=Math.sin(sT*2+i)*dt*0.2;if(x>13)x=-13;}
    else{y+=Math.sin(sT*0.9+i)*dt*0.35;x+=Math.cos(sT*0.7+i*2)*dt*0.3;}
    a.setXYZ(i,x,y,z);
  }
  a.needsUpdate=true;
}
