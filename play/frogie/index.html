<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Frogier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>window.KG_CFG={mode:"test"};</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Düzen: çıkartma stili mobil oyun arayüzü. Ana menüde 3B podyumda kurbağa solda, Oyna düğmesi sağda, alt sekme çubuğu. Sayfalar tam ekran kayarak açılır, duraklat ve sonuç ekranları açılır pencere olur. Oyun içinde sağ altta yuvarlak aksiyon düğmeleri. */
:root{
  --navy:#1b2a4e;
  --navy-2:#2e4474;
  --paper:#fff6dc;
  --paper-2:#ffe9b0;
  --green:#48d35e;--green-d:#1f8f3a;
  --yellow:#ffd23f;--yellow-d:#d38f00;
  --pink:#ff5c93;--pink-d:#b32a5c;
  --blue:#3fa7ff;--blue-d:#1d62c0;
  --gray:#8aa0c8;--gray-d:#4a6396;
  --purple:#9a63ff;
  --red:#ff4f5a;
  --ink:#1b2a4e;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
  --pop:cubic-bezier(.2,1.5,.4,1);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#8fd0ff;color:var(--navy);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#8fd0ff}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
button,select,input{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #fff;outline-offset:3px}
.ic{width:1.1em;height:1.1em;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.coin{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.lbl{font:800 10px/1 var(--body);letter-spacing:.14em;color:var(--navy-2);text-transform:uppercase}
.kc{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;box-sizing:border-box;border-radius:8px;background:#fff;color:var(--navy);border:2px solid var(--navy);font:800 11px/1 var(--body);box-shadow:0 2px 0 var(--navy);white-space:nowrap}

*,*::before,*::after{box-sizing:border-box}
.b,.ib,.dp,.slot .ic{box-sizing:border-box}

/* ----- Düğmeler ----- */
.b{--c:var(--green);--d:var(--green-d);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:4px solid var(--navy);border-radius:20px;background:var(--c);color:#fff;font:400 20px/1 var(--display);letter-spacing:.01em;padding:12px 18px;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.32);box-shadow:0 6px 0 var(--navy),inset 0 4px 0 rgba(255,255,255,.4),inset 0 -6px 0 var(--d);transition:transform .09s,box-shadow .09s,filter .15s}
.b:hover{filter:brightness(1.07)}
.b:active{transform:translateY(5px);box-shadow:0 1px 0 var(--navy),inset 0 4px 0 rgba(255,255,255,.4),inset 0 -6px 0 var(--d)}
.b.y{--c:var(--yellow);--d:var(--yellow-d);color:var(--navy);text-shadow:0 2px 0 rgba(255,255,255,.5)}
.b.p{--c:var(--pink);--d:var(--pink-d)}
.b.bl{--c:var(--blue);--d:var(--blue-d)}
.b.gr{--c:var(--gray);--d:var(--gray-d)}
.b.lg{font-size:22px;padding:14px 20px}
.b.sm{font-size:16px;padding:9px 12px;border-width:3px;border-radius:16px}
.b.round{width:48px;height:48px;padding:0;border-radius:50%;font-size:22px}
.b.round.sm{width:42px;height:42px}
.b.xl{font-size:38px;padding:16px 26px;border-radius:26px;border-width:5px}
.b[disabled]{filter:grayscale(.7);opacity:.7;cursor:not-allowed}
.dot{position:absolute;top:-8px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);border:3px solid var(--navy);animation:pulse 1.1s ease-in-out infinite;z-index:1}
@keyframes pulse{50%{transform:scale(1.22)}}

/* ----- Sticker bileşenler ----- */
.panel{background:var(--paper);border:5px solid var(--navy);border-radius:30px;box-shadow:0 9px 0 rgba(27,42,78,.5)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:99px;background:var(--paper);border:4px solid var(--navy);box-shadow:0 4px 0 rgba(27,42,78,.55);font:400 20px/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--yellow);border:3px solid var(--navy);box-shadow:0 3px 0 var(--navy);font:400 18px/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.chip .coin{width:20px;height:20px}
.ribbon{align-self:center;position:relative;padding:8px 30px;background:var(--pink);border:4px solid var(--navy);border-radius:14px;box-shadow:0 5px 0 var(--navy);color:#fff;font:400 24px/1 var(--display);text-shadow:0 3px 0 rgba(0,0,0,.3);text-align:center;margin-top:-34px}

/* ----- Ekran ve sayfa çerçevesi ----- */
#menu{position:absolute;inset:0;z-index:5;pointer-events:none}
#menu .view{position:absolute;inset:0;pointer-events:auto}
.page{display:flex;flex-direction:column;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 26px,transparent 26px 52px),
  linear-gradient(180deg,#58b7ff 0%,#2f8be0 55%,#2557b8 100%);animation:pageIn .42s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes pageIn{from{transform:translateX(9%);opacity:0}}
.phead{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.phead h2{margin:0;flex:1;font:400 clamp(26px,5vw,36px)/1 var(--display);color:#fff;text-shadow:0 4px 0 var(--navy),0 0 0 var(--navy);-webkit-text-stroke:2px var(--navy);paint-order:stroke fill;letter-spacing:.01em}
.pbody{flex:1;min-height:0;overflow:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.pbody>*{width:100%;max-width:820px;margin-inline:auto}
.sec{margin:6px auto -4px;font:400 18px/1 var(--display);color:#fff;text-shadow:0 3px 0 var(--navy);-webkit-text-stroke:1.5px var(--navy);paint-order:stroke fill}
.best{margin:0 auto;text-align:center;font:800 12px/1.3 var(--body);color:#fff;text-shadow:0 2px 0 var(--navy)}
.lead{margin:0;font:700 15px/1.45 var(--body);color:var(--navy)}
.modal{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px;background:rgba(14,24,52,.62);animation:fadeIn .25s ease both;overflow:auto}
.modal>.panel{width:min(440px,100%);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;animation:modalIn .5s var(--pop) both;margin:auto}
@keyframes fadeIn{from{opacity:0}}
@keyframes modalIn{from{transform:translateY(40px) scale(.7);opacity:0}}

/* ----- Ana menü ----- */
.home{background:radial-gradient(ellipse at 22% 55%,transparent 0 38%,rgba(14,24,52,.35) 100%),linear-gradient(90deg,transparent 40%,rgba(14,24,52,.28) 100%)}
.hbar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));animation:dropIn .6s var(--pop) both}
@keyframes dropIn{from{transform:translateY(-90px)}}
.me{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:99px;background:var(--paper);border:4px solid var(--navy);box-shadow:0 4px 0 rgba(27,42,78,.55);min-width:0}
.me img{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#fff,#bfe6ff);border:3px solid var(--navy);object-fit:contain}
.me div{display:flex;flex-direction:column;gap:4px;min-width:0}
.me b{font:400 18px/1 var(--display);white-space:nowrap}
.me span{font:800 12px/1 var(--body);color:var(--navy-2);white-space:nowrap}
.me svg{width:14px;height:14px;fill:var(--yellow);stroke:var(--navy);stroke-width:2;vertical-align:-2px}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.logo{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:88px;width:min(46vw,440px);margin:0;font:400 clamp(40px,8.4vw,84px)/.92 var(--display);color:var(--yellow);-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;text-shadow:0 7px 0 var(--navy);transform:rotate(-4deg);transform-origin:left center;animation:logoIn .8s var(--pop) .1s both,logoBob 3.4s ease-in-out .9s infinite;text-wrap:balance}
@keyframes logoIn{from{transform:rotate(-4deg) scale(.2);opacity:0}}
@keyframes logoBob{50%{transform:rotate(-3deg) translateY(-7px)}}
@keyframes logoBobC{0%,100%{transform:translateX(-50%) rotate(-4deg)}50%{transform:translateX(-50%) rotate(-3deg) translateY(-7px)}}
.frogtap{position:absolute;left:3%;top:30%;width:40%;height:62%;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hside{position:absolute;right:max(20px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-52%);width:min(380px,46vw);display:flex;flex-direction:column;gap:14px;animation:slideR .65s var(--pop) .15s both}
@keyframes slideR{from{transform:translate(120%,-52%)}}
.play{width:100%;flex-direction:column;gap:6px;padding:18px 20px 16px;animation:breathe 1.6s ease-in-out 1s infinite}
.play small{font:800 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--navy);text-shadow:none;background:rgba(255,255,255,.7);padding:5px 10px;border-radius:99px}
@keyframes breathe{50%{transform:scale(1.035)}}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hrow .b{flex-direction:column;gap:5px;padding:12px 8px}
.hrow small{font:800 11px/1 var(--body);text-shadow:none;opacity:.9;letter-spacing:.04em}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:0 max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));animation:riseIn .6s var(--pop) .25s both}
@keyframes riseIn{from{transform:translateY(120px)}}
.tab{flex:1;max-width:150px;flex-direction:column;gap:4px;padding:10px 6px 8px;font-size:15px}
.tab .ic{width:26px;height:26px}
.frogtap:active~.tabs{}
.hint-tap{position:absolute;left:23%;bottom:96px;transform:translateX(-50%);width:max-content;max-width:44%;text-align:center;font:800 12px/1 var(--body);letter-spacing:.1em;color:#fff;text-transform:uppercase;background:var(--navy);padding:8px 14px;border-radius:99px;pointer-events:none;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
@media (max-aspect-ratio:11/10){
  .logo{top:84px;width:min(70vw,420px);left:50%;transform:translateX(-50%) rotate(-4deg);transform-origin:center;text-align:center;animation:logoBobC 3.4s ease-in-out infinite}
  .hside{top:auto;bottom:110px;transform:none;right:50%;margin-right:calc(min(380px,92vw)/-2);width:min(380px,92vw);animation:none}
  .frogtap{left:10%;width:80%;top:22%;height:36%}
  .hint-tap{display:none}
}
@media (max-width:520px){
  #hFull,#hCtl,.me b[data-t]{display:none}
  .me{padding-right:12px}
}
@media (max-height:430px){
  .logo{top:78px;font-size:clamp(32px,7vw,56px);-webkit-text-stroke:5px var(--navy)}
  .b.xl{font-size:30px;padding:12px 20px}
  .hside{gap:10px}
  .play{padding:12px 16px 10px}
  .tab{padding:6px 4px 5px;font-size:13px}.tab .ic{width:22px;height:22px}
  .me img{width:42px;height:42px}
  .hint-tap{bottom:76px}
}

/* ----- Oyun içi arayüz ----- */
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding-block:12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none;z-index:2}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative}
.hl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.spill{display:flex;align-items:center;gap:12px;padding:6px 18px 6px 14px;background:var(--paper);border:4px solid var(--navy);border-radius:20px;box-shadow:0 4px 0 rgba(27,42,78,.55)}
.spill b{font:400 40px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--navy)}
.spill .lbl{writing-mode:horizontal-tb}
.lpill{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:6px 12px;background:rgba(27,42,78,.9);border-radius:14px;font:800 12px/1 var(--body);letter-spacing:.06em;color:#fff;text-transform:uppercase;max-width:260px}
.lpill b{font:800 12px/1 var(--body);color:var(--yellow)}
.lpill em{font-style:normal;opacity:.8}
.lpill span{white-space:nowrap}
#fps{font:800 11px/1 var(--body);color:#fff;font-variant-numeric:tabular-nums}
.cn{display:inline-flex;align-items:center;gap:6px;padding:5px 14px 5px 8px;background:var(--yellow);border:4px solid var(--navy);border-radius:99px;box-shadow:0 4px 0 rgba(27,42,78,.55);font:400 22px/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums;transform-origin:left center}
.cn .coin{width:24px;height:24px}
.cn.bump{animation:bump .3s var(--pop)}
@keyframes bump{40%{transform:scale(1.25)}}
.tr{display:flex;align-items:center;gap:8px}
#lives{display:flex;gap:4px;align-items:center;padding:6px 10px;background:var(--paper);border:4px solid var(--navy);border-radius:99px;box-shadow:0 4px 0 rgba(27,42,78,.55)}
.lf{width:26px;height:26px;flex:none;transition:transform .3s var(--pop)}
.lf.off{opacity:.3;filter:grayscale(1);transform:scale(.8)}
.ib{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:4px solid var(--navy);background:var(--blue);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 4px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 var(--blue-d)}
#btnPause{background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.5),inset 0 -4px 0 var(--yellow-d)}
.ib svg{width:22px;height:22px}
#btnMute .x{display:none}
#btnMute.muted .x{display:block}
@media (max-width:480px){.lpill{max-width:200px}.spill b{font-size:32px}}

#track{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:82px;bottom:200px;width:14px;display:flex;flex-direction:column-reverse;border-radius:99px;overflow:visible;background:var(--navy);border:3px solid var(--navy);z-index:2;pointer-events:none;box-shadow:0 3px 0 rgba(27,42,78,.5)}
#track i{display:block;flex:1}
#track i:first-child{border-radius:0 0 99px 99px}
#track i:last-child{border-radius:99px 99px 0 0}
#track .g{background:#5fd06a}#track .r{background:#5b6785}#track .w{background:#47b8ff}#track .f{background:var(--yellow)}
#mark{position:absolute;left:50%;bottom:0;width:26px;height:26px;margin-left:-13px;margin-bottom:-13px;border-radius:50%;background:var(--green);border:4px solid var(--navy);box-sizing:border-box;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:bottom .15s linear}

.hints{display:flex;flex-wrap:wrap;gap:8px 14px;max-width:44%;padding:10px 14px;background:var(--paper);border:4px solid var(--navy);border-radius:18px;box-shadow:0 4px 0 rgba(27,42,78,.55);font:800 11px/1 var(--body);color:var(--navy);align-items:center}
.hints span{display:inline-flex;gap:5px;align-items:center}
.hotbar{position:absolute;right:0;bottom:0;width:244px;height:196px;pointer-events:none}
.slot{--p:360deg;--c:var(--yellow);position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--navy);padding:0;cursor:pointer;touch-action:none;pointer-events:auto}
.slot .ic{position:relative;width:78px;height:78px;border-radius:50%;background:var(--c);border:5px solid var(--navy);display:grid;place-items:center;overflow:hidden;color:var(--navy);box-shadow:0 6px 0 var(--navy),inset 0 5px 0 rgba(255,255,255,.45);transition:transform .08s,box-shadow .08s;stroke:none;fill:none}
.slot:active .ic{transform:translateY(5px);box-shadow:0 1px 0 var(--navy),inset 0 5px 0 rgba(255,255,255,.45)}
.slot .ic::after{content:"";position:absolute;inset:0;background:conic-gradient(transparent var(--p),rgba(27,42,78,.72) 0)}
.slot .ic svg{width:36px;height:36px;position:relative;z-index:1}
.slot.ready .ic{animation:rdy .5s var(--pop)}
@keyframes rdy{40%{transform:scale(1.14)}}
.slot .nm{display:none}
.slot.tongue{right:0;bottom:6px;--c:var(--pink)}
.slot.tongue .ic{width:98px;height:98px}
.slot.tongue .ic svg{width:44px;height:44px}
.slot.jump{right:12px;bottom:128px}
.slot.dash{right:126px;bottom:8px;--c:var(--blue)}
.slot .kcw{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);z-index:2}
.slot.dash .ic,.slot.tongue .ic{color:#fff}
.stam{position:absolute;left:0;top:0;transform:translate(-9999px,-9999px);width:min(170px,42vw);display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--paper);border:3px solid var(--navy);border-radius:99px;box-shadow:0 3px 0 rgba(27,42,78,.55);opacity:0;transition:opacity .25s;pointer-events:none;z-index:2}
.stam.show{opacity:1}
.stam .lbl{color:var(--navy)}
.stam .bar{flex:1;height:12px;background:#cfd9ee;border:2px solid var(--navy);border-radius:99px;overflow:hidden}
.stam .bar i{display:block;height:100%;width:100%;background:#2fb4ff;border-radius:99px}
.stam.low .bar i{background:var(--red)}
.edge{position:absolute;top:0;bottom:0;width:16%;opacity:0;pointer-events:none;z-index:1;background:linear-gradient(to right,rgba(255,79,90,.7),transparent)}
.edge.r{right:0;transform:scaleX(-1)}
.edge.l{left:0}
.touch{display:none;grid-template-columns:repeat(3,58px);grid-template-areas:". up ." "left down right";gap:6px;pointer-events:auto}
.dp{width:58px;height:58px;border-radius:50%;border:4px solid var(--navy);background:var(--paper);display:grid;place-items:center;color:var(--navy);padding:0;touch-action:none;box-shadow:0 4px 0 var(--navy)}
.dp svg{width:26px;height:26px}
.dp.up{grid-area:up}.dp.left{grid-area:left}.dp.down{grid-area:down}.dp.right{grid-area:right}
.dp.on{background:var(--yellow);transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
@media (pointer:coarse){
  .touch{display:grid}
  .hints,.slot .kcw{display:none}
  #track{bottom:210px}
}
@media (pointer:coarse) and (max-width:430px){
  .touch{grid-template-columns:repeat(3,48px);gap:5px}
  .dp{width:48px;height:48px}.dp svg{width:22px;height:22px}
  .hotbar{transform:scale(.8);transform-origin:right bottom}
}
@media (max-width:980px){.hints{display:none}}
@media (max-height:520px){.spill b{font-size:30px}.hotbar{transform:scale(.82);transform-origin:right bottom}#track{top:70px;bottom:150px}}

#banner{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;pointer-events:none;opacity:0;z-index:4}
#banner b{font:400 clamp(40px,9vw,72px)/1 var(--display);color:var(--yellow);-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;text-shadow:0 6px 0 var(--navy)}
#banner span{font:400 18px/1 var(--display);color:var(--navy);background:#fff;border:4px solid var(--navy);padding:6px 14px;border-radius:99px;box-shadow:0 4px 0 var(--navy)}
#banner span:empty{display:none}
#banner.show{animation:bn 1.9s var(--pop) forwards}
@keyframes bn{0%{opacity:0;transform:scale(.3) rotate(-8deg)}14%{opacity:1;transform:scale(1.12) rotate(2deg)}24%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 28px/1 var(--display);color:var(--yellow);-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;white-space:nowrap;animation:pop 1s ease-out forwards}
.pop.gold{color:#fff}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}
.flyc{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;transition:transform .65s cubic-bezier(.5,0,.8,.4),opacity .65s;z-index:3}
.flyc svg{width:100%;height:100%}

/* ----- Sonuç ve duraklat ----- */
#vResult>.panel{padding-top:34px;margin-top:50px}
#vResult h1,#vPause h1{margin:0;text-align:center;font:400 clamp(34px,8vw,46px)/1 var(--display);color:var(--yellow);-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;text-shadow:0 5px 0 var(--navy);text-wrap:balance}
#vResult[data-k=over] h1{color:#ffb4b4}
#vResult[data-k=over] .ribbon{background:var(--gray)}
.rstars{display:flex;justify-content:center;align-items:flex-end;gap:6px}
.rstars span{display:inline-flex}
.rstars svg{width:68px;height:68px;filter:drop-shadow(0 4px 0 var(--navy))}
.rstars span:nth-child(2) svg{width:84px;height:84px;margin-bottom:10px}
.rstars .on{color:var(--yellow);animation:starPop .7s var(--pop) both}
.rstars .off{color:#c5cde0}
.rstars span:nth-child(1).on{animation-delay:.35s}.rstars span:nth-child(2).on{animation-delay:.65s}.rstars span:nth-child(3).on{animation-delay:.95s}
@keyframes starPop{0%{transform:scale(0) rotate(-120deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.res{display:flex;gap:8px}
.res div{flex:1;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:center}
.res b{font:400 26px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--navy)}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:18px;background:var(--yellow);border:4px solid var(--navy);box-shadow:0 4px 0 var(--navy);font:400 30px/1 var(--display);color:var(--navy)}
.earn .coin{width:32px;height:32px}
.earn small{font:800 11px/1 var(--body);letter-spacing:.1em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pgrid .b{flex-direction:column;gap:6px;padding:12px 6px;font-size:17px}
.pgrid .ic{width:26px;height:26px}

/* ----- Dünya haritası ----- */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px;max-width:900px!important}
.world{border:5px solid var(--navy);border-radius:26px;overflow:hidden;background:var(--paper);box-shadow:0 7px 0 rgba(27,42,78,.5)}
.wh{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:linear-gradient(90deg,var(--w1),var(--w2));border-bottom:5px solid var(--navy)}
.wh b{font:400 20px/1 var(--display);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.wh small{font:800 11px/1.25 var(--body);margin-left:auto;text-align:right;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.path{position:relative;height:150px;background:radial-gradient(circle at 20% 80%,rgba(255,255,255,.7),transparent 50%),linear-gradient(180deg,var(--paper),var(--paper-2))}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%}
.path svg.trail path{fill:none;stroke:var(--navy);stroke-width:5;stroke-dasharray:2 11;stroke-linecap:round;opacity:.55}
.lv{--nc:var(--w1);position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--navy)}
.lv .nd{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--nc);border:5px solid var(--navy);box-shadow:0 5px 0 var(--navy),inset 0 4px 0 rgba(255,255,255,.45);font:400 28px/1 var(--display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);transition:transform .1s}
.lv:active:not(:disabled) .nd{transform:translateY(4px)}
.lv:disabled{cursor:not-allowed}
.lv:disabled .nd{background:#9aa6c2;color:#e8edf8}
.lv:disabled .nd svg{width:28px;height:28px;stroke:currentColor}
.lv.cur .nd{animation:curp 1.2s ease-in-out infinite}
@keyframes curp{50%{transform:scale(1.14);box-shadow:0 5px 0 var(--navy),0 0 0 8px rgba(255,210,63,.65),inset 0 4px 0 rgba(255,255,255,.45)}}
.lv.cur::before{content:"";position:absolute;top:-22px;left:50%;width:0;height:0;margin-left:-9px;border:9px solid transparent;border-top:14px solid var(--navy);animation:arrow .8s ease-in-out infinite}
@keyframes arrow{50%{transform:translateY(5px)}}
.stars{display:flex;gap:1px;align-items:center;color:#c5cde0;min-height:18px}
.stars svg{width:18px;height:18px;filter:drop-shadow(0 1px 0 var(--navy))}
.stars .on{color:var(--yellow)}
.stars .off{color:#c5cde0}
.stars span{display:inline-flex}

/* ----- Mağaza, koleksiyon, başarım, günlük ----- */
.offer,.pkrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px;border:5px solid var(--navy);border-radius:24px;background:var(--paper);box-shadow:0 6px 0 rgba(27,42,78,.5)}
.offer{background:linear-gradient(120deg,var(--paper) 45%,var(--rc) 260%)}
.offer img,.mini{width:84px;height:84px;border-radius:18px;background:radial-gradient(circle at 50% 40%,#fff,#bfe6ff);border:3px solid var(--navy);object-fit:contain}
.offer b,.pkrow b{font:400 21px/1.05 var(--display);display:block;color:var(--navy)}
.offer small,.pkrow small{display:block;margin-top:5px;font:700 12px/1.35 var(--body);color:var(--navy-2)}
.rar{font:800 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--rc);-webkit-text-stroke:.5px var(--navy);paint-order:stroke fill}
.buy{border:4px solid var(--navy);border-radius:16px;background:var(--yellow);color:var(--navy);font:400 20px/1 var(--display);padding:11px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 5px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 var(--yellow-d);white-space:nowrap;transition:transform .08s,box-shadow .08s}
.buy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.5)}
.buy.cant{background:#b9c4de;box-shadow:0 5px 0 var(--navy),inset 0 3px 0 rgba(255,255,255,.5),inset 0 -5px 0 #8191b4;color:#51608a}
.buy[disabled]{opacity:.55;cursor:default}
.buy s{opacity:.55;font-size:13px}
.buy .coin{width:22px;height:22px}
.mini{display:grid;place-items:center;width:64px;height:88px;border-radius:12px;position:relative;overflow:hidden}
.mini svg{width:34px;height:34px}
.pk-basic{--g1:#4fdc63;--g2:#17803a}.pk-rare{--g1:#58b4ff;--g2:#2a46c2}.pk-epic{--g1:#ffd04a;--g2:#e0541f}
.mini,.pkbig{background:linear-gradient(160deg,var(--g1),var(--g2))}
.odds{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.odds i{font:800 10px/1 var(--body);font-style:normal;padding:4px 7px;border-radius:99px;background:var(--navy);color:#fff;border:2px solid var(--rc)}
.collgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 10px;border-radius:20px;border:4px solid var(--navy);background:linear-gradient(180deg,#fff,var(--paper));color:var(--navy);cursor:pointer;font-family:inherit;box-shadow:0 5px 0 var(--navy);transition:transform .1s}
.sk::before{content:"";position:absolute;left:8px;right:8px;top:6px;height:6px;border-radius:99px;background:var(--rc)}
.sk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
.sk img{width:88px;height:88px;object-fit:contain;margin-top:6px}
.sk b{font:400 16px/1.1 var(--display);text-align:center}
.sk.no{background:#c9d3ea;cursor:default;box-shadow:0 5px 0 rgba(27,42,78,.5)}
.sk.no img{filter:brightness(0);opacity:.28}
.sk.no b{color:#6b7aa1}
.sk.eq{background:linear-gradient(180deg,#d7ffd9,#9ff0a4);box-shadow:0 5px 0 var(--navy),0 0 0 4px var(--green)}
.sk .tag{position:absolute;top:-10px;right:-6px;font:400 12px/1 var(--display);padding:5px 9px;border-radius:99px;background:var(--green);color:#fff;border:3px solid var(--navy);text-shadow:0 1px 0 rgba(0,0,0,.4);z-index:1}
.sk .cnt{position:absolute;top:14px;left:8px;font:800 11px/1 var(--body);padding:3px 6px;border-radius:99px;background:var(--navy);color:#fff}
.hero{position:relative;overflow:hidden;min-height:156px;display:flex;gap:16px;align-items:center;padding:12px 18px;border-radius:26px;border:5px solid var(--navy);background:#fff;box-shadow:0 7px 0 rgba(27,42,78,.5);color:var(--navy)}
.hero::before{content:"";position:absolute;left:-60px;top:50%;width:300px;height:300px;margin-top:-150px;background:repeating-conic-gradient(from 0deg,var(--rc) 0 10deg,transparent 10deg 20deg);opacity:.35;animation:spin 18s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.hero img,.hero div{position:relative}
.hero img{width:120px;height:120px;object-fit:contain;animation:bobImg 2.2s ease-in-out infinite}
@keyframes bobImg{50%{transform:translateY(-6px) rotate(2deg)}}
.hero b{font:400 28px/1 var(--display);display:block;margin:6px 0}
.hero .best{color:var(--navy-2);text-shadow:none}
.ach{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 14px;border:4px solid var(--navy);border-radius:20px;background:var(--paper);box-shadow:0 5px 0 rgba(27,42,78,.5)}
.ach b{font:400 18px/1.1 var(--display);color:var(--navy)}
.ach small{display:block;font:700 12px/1.3 var(--body);color:var(--navy-2);margin-top:3px}
.ach .best{color:var(--green-d);text-shadow:none}
.pbar{grid-column:1/-1;height:14px;border-radius:99px;background:#cfd9ee;border:3px solid var(--navy);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 8px,transparent 8px 16px)}
.ach.ok{background:#fff3b8;animation:pulseSoft 1.6s ease-in-out infinite}
@keyframes pulseSoft{50%{transform:scale(1.012)}}
.ach.ok .pbar i{background-color:var(--yellow)}
.ach.done{opacity:.6}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.dd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 2px;border-radius:16px;border:4px solid var(--navy);background:var(--paper);font:800 10px/1 var(--body);color:var(--navy-2);text-align:center;box-shadow:0 4px 0 rgba(27,42,78,.5);min-height:92px}
.dd b{font:400 17px/1 var(--display);color:var(--navy)}
.dd.done{background:#b6f2bb;box-shadow:0 4px 0 var(--green-d)}
.dd.today{background:#fff0a6;animation:todayB 1s var(--pop) infinite alternate;border-color:var(--navy);box-shadow:0 4px 0 var(--yellow-d)}
@keyframes todayB{to{transform:translateY(-8px)}}
.dd .coin{width:22px;height:22px}
.dd svg.gift{width:26px;height:26px;color:var(--pink)}
.dd:last-child{grid-column:auto}
.setrow{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:20px;background:var(--paper);border:4px solid var(--navy);box-shadow:0 5px 0 rgba(27,42,78,.5);color:var(--navy)}
.setrow label,.chk{font:400 18px/1.2 var(--display);color:var(--navy)}
.setrow input[type=range]{width:100%;height:30px;accent-color:var(--green)}
.setrow select{appearance:none;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:14px;padding:11px 14px;font:800 15px var(--body);box-shadow:0 3px 0 var(--navy)}
.chk{display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer;padding:14px 16px;border-radius:20px;background:var(--paper);border:4px solid var(--navy);box-shadow:0 5px 0 rgba(27,42,78,.5)}
.chk input{appearance:none;width:58px;height:32px;border-radius:99px;background:#aebbd8;border:3px solid var(--navy);position:relative;flex:none;cursor:pointer;transition:background .2s}
.chk input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--navy);box-sizing:content-box;margin:-3px 0 0 -3px;transition:transform .2s var(--pop)}
.chk input:checked{background:var(--green)}
.chk input:checked::after{transform:translateX(26px)}
.ctl{display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:12px 16px;align-items:center;padding:16px;border-radius:22px;background:var(--paper);border:4px solid var(--navy);box-shadow:0 5px 0 rgba(27,42,78,.5)}
.ctl .k{display:flex;gap:4px;flex-wrap:wrap}
.ctl .d{font:700 13px/1.35 var(--body);color:var(--navy)}
.note{padding:14px 16px;border-radius:20px;background:var(--paper);border:4px solid var(--navy);color:var(--navy)}

/* ----- Paket açma ----- */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:5;background:rgba(14,24,52,.8)}
#pack{z-index:12;background:radial-gradient(circle at 50% 42%,#3a7be0,#1b2f6e 60%,#0e1736);flex-direction:column;overflow:hidden}
#pack::before{content:"";position:absolute;left:50%;top:44%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.1) 0 7deg,transparent 7deg 14deg);animation:spin 40s linear infinite;pointer-events:none}
.pkstage{position:relative;width:100%;max-width:680px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.pkbig{--rc:#fff;position:relative;width:min(210px,52vw);aspect-ratio:3/4.2;border-radius:24px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:inherit;overflow:hidden;border:6px solid var(--navy);box-shadow:0 10px 0 var(--navy),inset 0 6px 0 rgba(255,255,255,.4),inset 0 -10px 0 rgba(0,0,0,.2);animation:pkfloat 2.2s ease-in-out infinite}
.pkbig::before{content:"";position:absolute;inset:-40% -20%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);animation:shine 2.4s linear infinite}
.pkbig svg{width:46%;position:relative}
.pkbig b{font:400 25px/1 var(--display);position:relative;text-shadow:0 3px 0 rgba(0,0,0,.4);-webkit-text-stroke:2px var(--navy);paint-order:stroke fill}
.pkbig span{font:800 12px/1 var(--body);letter-spacing:.16em;position:relative}
.pkbig.shake{animation:pkshake .95s ease-in forwards}
@keyframes pkfloat{50%{transform:translateY(-12px) rotate(-2deg)}}
@keyframes shine{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
@keyframes pkshake{0%{transform:rotate(0) scale(1)}15%{transform:rotate(-9deg) scale(1.05)}30%{transform:rotate(9deg) scale(1.1)}45%{transform:rotate(-11deg) scale(1.15)}60%{transform:rotate(11deg) scale(1.2)}80%{transform:rotate(-7deg) scale(1.28)}100%{transform:rotate(0) scale(1.6);opacity:0;filter:brightness(3)}}
#pkHint{margin:0;font:400 20px/1.2 var(--display);letter-spacing:.04em;color:#fff;text-shadow:0 3px 0 var(--navy);animation:blink 1.4s ease-in-out infinite}
.pkcards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;perspective:900px}
.pc{--rc:#9fb3a6;width:min(156px,28vw);min-width:104px;aspect-ratio:3/4.4;padding:0;border:0;background:none;cursor:pointer;font-family:inherit;color:var(--navy);animation:pcin .55s var(--pop) both}
.pc:nth-child(2){animation-delay:.12s}.pc:nth-child(3){animation-delay:.24s}.pc:nth-child(4){animation-delay:.36s}
@keyframes pcin{from{opacity:0;transform:translateY(60px) scale(.6)}}
.pcin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s var(--pop)}
.pc.flip .pcin{transform:rotateY(180deg)}
.pcb,.pcf{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;border:5px solid var(--navy)}
.pcb{background:repeating-linear-gradient(135deg,#4fdc63 0 14px,#3cc352 14px 28px);box-shadow:0 7px 0 var(--navy)}
.pcb svg{width:50%}
.pcf{transform:rotateY(180deg);background:linear-gradient(170deg,#fff,var(--paper-2));box-shadow:0 0 0 4px var(--rc),0 0 30px var(--rc),0 7px 0 var(--navy)}
.pcf img{width:84%;aspect-ratio:1;object-fit:contain}
.pcf b{font:400 18px/1.05 var(--display)}
.pcf em{font:800 11px/1 var(--body);font-style:normal;padding:5px 9px;border-radius:99px;background:var(--green);color:#fff;border:2px solid var(--navy);letter-spacing:.06em}
.pcf em.dup{background:var(--yellow);color:var(--navy)}
.pkbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,rgba(255,210,63,.7) 40%,transparent 70%);opacity:0;pointer-events:none;z-index:2}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.cf{position:absolute;top:-14px;width:11px;height:15px;border-radius:3px;pointer-events:none;z-index:30;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}

/* ----- Yükleme ekranı ----- */
#loader{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#4cb4ff 0%,#9ee2ff 55%,#c9f2ff 100%);transition:opacity .5s;overflow:hidden;padding:16px}
#loader::before{content:"";position:absolute;left:50%;top:38%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.28) 0 8deg,transparent 8deg 16deg);animation:spin 50s linear infinite}
#loader.out{opacity:0;pointer-events:none;transform:scale(1.08);transition:opacity .5s,transform .5s}
.ldmain{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,100%);text-align:center;margin-bottom:12%}
.ldkick{display:none}
.ldtitle{margin:0;font:400 clamp(46px,11vw,84px)/.95 var(--display);color:var(--yellow);-webkit-text-stroke:8px var(--navy);paint-order:stroke fill;text-shadow:0 8px 0 var(--navy);text-wrap:balance;transform:rotate(-3deg)}
.ldfrog{width:104px;height:104px;animation:ldhop .7s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(27,42,78,.35))}
@keyframes ldhop{0%,100%{transform:translateY(0) scale(1.1,.9)}50%{transform:translateY(-30px) scale(.94,1.08)}}
.ldbar{width:100%;height:28px;border-radius:99px;background:#fff;overflow:hidden;border:5px solid var(--navy);box-shadow:0 5px 0 var(--navy)}
.ldbar i{display:block;height:100%;width:0;background:var(--green);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 12px,transparent 12px 24px);background-size:34px 34px;animation:stripes .8s linear infinite;border-radius:99px}
@keyframes stripes{to{background-position:34px 0}}
.ldmsg{margin:0;font:400 15px/1 var(--display);letter-spacing:.06em;color:var(--navy);min-height:15px}
.ldtip{margin:0;font:800 14px/1.4 var(--body);color:var(--navy);min-height:40px;max-width:36ch}
.ldroad{position:absolute;left:0;right:0;bottom:0;height:20%;background:#3a4363;border-top:8px solid #4fcf5a;z-index:1}
.ldroad::before{content:"";position:absolute;left:0;right:0;top:50%;height:5px;background:repeating-linear-gradient(90deg,#fff 0 36px,transparent 36px 72px);opacity:.75}
.ldcar{position:absolute;width:86px;height:32px;border-radius:10px 14px 8px 8px;border:4px solid var(--navy);box-sizing:border-box;animation:ldcar linear infinite}
.ldcar::after{content:"";position:absolute;left:14px;top:-18px;width:44px;height:16px;border-radius:9px 9px 0 0;background:inherit;border:4px solid var(--navy);border-bottom:0}
@keyframes ldcar{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}

/* ----- Geçiş ve bildirim ----- */
#wipe{position:absolute;inset:0;z-index:25;pointer-events:none;background:var(--green);clip-path:circle(0% at 50% 50%);display:grid;place-items:center}
#wipe svg{width:120px;height:120px;animation:ldhop .6s ease-in-out infinite}
#wipe.in{pointer-events:auto;animation:wipeIn .38s cubic-bezier(.6,0,.9,.5) forwards}

function setAmbient(){
  const a=BIO.amb,q=QUAL[S.quality]||QUAL.high;
  ambN=Math.min(AMB_MAX,Math.round(a.n*(q.amb||1)));
  ambMat.color.setHex(a.c);ambMat.size=a.size;ambMat.opacity=a.op;
  ambMat.blending=a.add?THREE.AdditiveBlending:THREE.NormalBlending;

  ambGeo.setDrawRange(0,ambN);
  for(let i=0;i<AMB_MAX;i++){
    ambPos[i*3]=camFocusV.x+rand(-14,14);
    ambPos[i*3+1]=rand(a.y[0],a.y[1]);
    ambPos[i*3+2]=camFocusV.z+rand(-16,10);
    ambPh[i]=rand(0,6.28);

function updateAmbient(dt,fx,fz){
  camFocusV.set(fx,0,fz);
  const a=BIO.amb;
  for(let i=0;i<ambN;i++){
    let x=ambPos[i*3],y=ambPos[i*3+1],z=ambPos[i*3+2];
    const ph=ambPh[i];
    if(a.wander){x+=Math.sin(T*0.7+ph)*0.6*dt;z+=Math.cos(T*0.5+ph*1.3)*0.6*dt;y+=Math.sin(T*1.1+ph)*0.4*dt;}
    else{x+=((a.vx||0)+Math.sin(T+ph)*(a.sway||0))*dt;y+=(a.vy||0)*dt;}
    if(y<a.y[0]-0.1)y=a.y[1];
    if(y>a.y[1]+0.1)y=a.y[0];
    if(x>fx+14)x-=28;else if(x<fx-14)x+=28;

function tone(f1,f2,dur,type,vol){
  if(!AC||S.vol<=0)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';
    o.frequency.setValueAtTime(f1,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(vol||0.05,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(master);
    o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}

  sk.m={body:new THREE.MeshLambertMaterial(Object.assign({color:sk.body},o)),dark:new THREE.MeshLambertMaterial(Object.assign({color:sk.dark},o))};

}

const thumbCache={};
function fallbackThumb(sk){
  const c='#'+('000000'+sk.body.toString(16)).slice(-6);
  return 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="14" r="9" fill="'+c+'"/><circle cx="7" cy="7" r="4" fill="'+c+'"/><circle cx="17" cy="7" r="4" fill="'+c+'"/><circle cx="7" cy="7" r="2.2" fill="#fff"/><circle cx="17" cy="7" r="2.2" fill="#fff"/><circle cx="7.4" cy="7.3" r="1.1" fill="#151515"/><circle cx="17.4" cy="7.3" r="1.1" fill="#151515"/></svg>');
}
function skinThumb(sk){
  if(thumbCache[sk.id])return thumbCache[sk.id];
  let url='';
  try{
    if(!thumbR){
      const cv=document.createElement('canvas');cv.width=cv.height=224;
      thumbR=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true,preserveDrawingBuffer:true});
      thumbR.setSize(224,224,false);thumbR.setClearColor(0x000000,0);
      thumbS=new THREE.Scene();
      thumbS.add(new THREE.HemisphereLight(0xffffff,0x6a8f5a,0.95));
      const dl=new THREE.DirectionalLight(0xffffff,0.8);dl.position.set(2,4,-3);thumbS.add(dl);
      thumbC=new THREE.PerspectiveCamera(30,1,0.1,20);thumbC.position.set(1.05,1.0,-1.6);thumbC.lookAt(0,0.36,-0.02);
    }
    const g=new THREE.Group(),inner=new THREE.Group();g.add(inner);fillFrog(inner,sk);
    if(sk.rainbow){const M=skMats(sk);M.body.color.setHSL(0.78,0.8,0.58);M.dark.color.setHSL(0.78,0.8,0.42);}
    thumbS.add(g);thumbR.render(thumbS,thumbC);url=thumbR.domElement.toDataURL('image/png');thumbS.remove(g);
  }catch(e){url='';}
  thumbCache[sk.id]=url||fallbackThumb(sk);
  return thumbCache[sk.id];
}
function freeThumbs(){
  if(!thumbR)return;
  try{thumbR.dispose();if(thumbR.forceContextLoss)thumbR.forceContextLoss();}catch(e){}
  thumbR=null;
}

  const cap=mk(sph(0.5*sc,9,6),mat(0x9a4a8a,{emissive:0x4a1a44}),0,0.62*sc,0);cap.scale.set(1,0.55,1);g.add(cap);
}
function spire(g){
  const h=rand(1.1,2.0);
  g.add(mk(cone(0.42,h,5),mat(0x2b2230,{emissive:0x2a0c06}),0,h/2,0));
  g.add(mk(cone(0.44,0.5,5),mat(0xff5a1c,{emissive:0xff4010}),0,0.25,0,false));
}
function sideTree(x,z){
  const s=rand(0.8,1.3),g=new THREE.Group(),id=BIO.id;
  if(id==='meadow')pineTree(g);
  else if(id==='desert'){if(Math.random()<0.6)palm(g);else cactus(g,1.7);}
  else if(id==='snow')snowPine(g);
  else if(id==='swamp'){if(Math.random()<0.65)deadTree(g);else mushroom(g,1.4);}
  else spire(g);
  g.position.set(x,0,z);g.scale.set(s,s,s);world.add(g);
}
function bigDecor(x,z){
  const id=BIO.id;
  if(id==='meadow'||id==='desert'||id==='swamp'){
    const col=id==='meadow'?0x6bb35a:id==='desert'?0xe0bb72:0x2c4a3a;
    const h=mk(sph(1,10,7),mat(col),x,-0.2,z,false);h.scale.set(rand(2.5,4),rand(1.1,2),rand(2,3));world.add(h);
    if(id==='desert'&&Math.random()<0.4){const p=mk(cone(2.6,3.4,4),mat(0xcfa45a),x,1.7,z);p.rotation.y=Math.PI/4;world.add(p);}
  }else if(id==='snow'){
    const r=rand(2,3.2),hh=rand(4,7);
    world.add(mk(cone(r,hh,6),mat(0x9db3c8),x,hh/2,z));
    world.add(mk(cone(r*0.45,hh*0.4,6),mat(0xffffff),x,hh*0.8,z,false));
  }else{
    world.add(mk(cone(2.6,5.5,9),mat(0x2b1e20),x,2.75,z));
    world.add(mk(cone(0.9,0.9,9),mat(0xff5a1c,{emissive:0xff4010}),x,5.05,z,false));
  }
}
function makeObstacle(x,z){
  const id=BIO.id,g=new THREE.Group();

    g.add(mk(sph(0.26,9,7),mat(0xffffff),0,0.78,0));
    g.add(mk(sph(0.18,8,6),mat(0xffffff),0,1.1,0));

function buildGate(z){
  for(const s of [-1,1])world.add(mk(cyl(0.1,0.1,2.7,6),mat(0xf2f2f2),s*5.9,1.35,z));
  for(let k=0;k<12;k++)world.add(mk(box(0.98,0.46,0.1),mat(k%2?0xffffff:0xe8454a),-5.4+k*0.98,2.5,z));
}
function buildGrass(lane){
  const goal=lane.type==='goal', z=lane.z, q=QUAL[S.quality]||QUAL.high;
  world.add(mk(box(44,0.3,1),mat(goal?BIO.goal:BIO.grass[lane.i%2]),0,-0.15,z,false,true));
  for(const sd of [-1,1]){
    const n=Math.round(irand(0,3)*q.trees);
    for(let k=0;k<n;k++)sideTree(sd*rand(7.4,13),z+rand(-0.25,0.25));
    if(Math.random()<0.3*q.trees)bigDecor(sd*rand(14,22),z+rand(-0.3,0.3));
  }
  smallDeco(lane,goal);
  if(BIO.id!=='meadow'&&!goal&&lane.i>0){const n=irand(0,2);for(let k=0;k<n;k++)makeObstacle(rand(-5,5),z+rand(-0.25,0.25));}
  if(goal)buildGate(z);
}
function buildCar(len,truck,dir,color){
  const g=new THREE.Group();
  const wheel=geo('wheel',()=>new THREE.CylinderGeometry(0.13,0.13,0.1,8).rotateX(Math.PI/2));
  const wm=mat(0x15171c), lamp=mat(0xfff3a0,{emissive:0xffe680});
  if(truck){
    g.add(mk(box(len*0.68,0.62,0.74),mat(0xdfe3e8),-len*0.16,0.46,0));
    g.add(mk(box(len*0.28,0.5,0.7),mat(color),len*0.36,0.38,0));
    g.add(mk(box(0.04,0.2,0.56),mat(0x8fd3ff),len*0.5,0.5,0,false));
  }else{
    g.add(mk(box(len,0.32,0.68),mat(color),0,0.3,0));
    g.add(mk(box(len*0.5,0.28,0.58),mat(color),-len*0.05,0.58,0));
    g.add(mk(box(len*0.52,0.15,0.6),mat(0x9fd8ff),-len*0.05,0.6,0,false));
  }
  g.add(mk(box(0.05,0.08,0.14),lamp,len/2,truck?0.24:0.32,0.22,false));
  g.add(mk(box(0.05,0.08,0.14),lamp,len/2,truck?0.24:0.32,-0.22,false));
  for(const sx of [-1,1])for(const sz of [-1,1])g.add(mk(wheel,wm,sx*len*0.3,0.13,sz*0.36));
  g.rotation.y=dir>0?0:Math.PI;
  return g;
}
function buildRoad(lane,seq,lv){
  const z=lane.z;
  world.add(mk(box(44,0.3,1),mat(BIO.road),0,-0.15,z,false,true));
  if(seq[lane.i+1]==='road'){for(let x=-20;x<=20;x+=2)world.add(mk(box(0.9,0.012,0.07),mat(BIO.line),x,0.008,z-0.5,false));}
  if(seq[lane.i-1]!=='road')world.add(mk(box(44,0.07,0.1),mat(BIO.curb),0,0.03,z+0.47,false));
  if(seq[lane.i+1]!=='road')world.add(mk(box(44,0.07,0.1),mat(BIO.curb),0,0.03,z-0.47,false));
  lane.speed=Math.min(6.4,1.4+(lv<=12?lv*0.25:3+(lv-12)*0.03)+rand(0,1.2));
  const count=lv>=4?4:3, spacing=RING/count, base=rand(0,RING);
  for(let k=0;k<count;k++){
    const truck=Math.random()<0.3, len=truck?2.5:rand(1.2,1.5);
    const mesh=buildCar(len,truck,lane.dir,pick(BIO.cars));
    mesh.position.z=z;
    world.add(mesh);
    lane.objs.push({kind:'car',len:len,p:base+k*spacing+rand(0,1.6),x:0,mesh:mesh,lane:lane});
  }
}
function makeSlab(len,kind){
  let mesh,top,restY;
  if(kind==='ice'){
    mesh=mk(box(len,0.18,0.82),mat(0xeaf6fb),0,0,0);
    restY=-0.02;top=0.07;
  }else{
    mesh=mk(box(len,0.2,0.8),mat(0x3a3033),0,0,0);
    mesh.add(mk(box(len+0.06,0.05,0.88),mat(0xff5a1c,{emissive:0xff4010}),0,-0.07,0,false));
    restY=-0.01;top=0.09;
  }
  return {mesh:mesh,top:top,restY:restY};
}
function buildRiver(lane,lv,idx){
  const z=lane.z,wk=BIO.wkind,turtles=idx%2===1;
  const wmat=wk==='lava'?lavaMats[lane.i%2]:mat(BIO.water[lane.i%2]);
  world.add(mk(box(44,0.3,1),wmat,0,-0.27,z,false,true));
  const shimC=wk==='lava'?0xffd24a:0xffffff,shimO=wk==='lava'?0.5:(wk==='ice'?0.6:0.35);
  for(let k=0;k<6;k++){
    const m=mk(box(rand(0.8,1.6),0.012,0.05),mat(shimC,{transparent:true,opacity:shimO}),0,-0.11,z+rand(-0.35,0.35),false);
    world.add(m);lane.shim.push({p:rand(0,RING),mesh:m});
  }
  for(const sd of [-1,1]){
    const x=sd*rand(7.4,10),zz=z+rand(-0.25,0.25);
    if(wk==='water'||wk==='swamp'){
      const lp=mk(cyl(0.34,0.34,0.03,10),mat(wk==='swamp'?0x2f6a3a:0x4fae48),x,-0.1,zz,false);
      world.add(lp);
      if(Math.random()<0.5)world.add(mk(sph(0.1,6,5),mat(0xff8fb3,wk==='swamp'?{emissive:0x502030}:{}),x,-0.04,zz,false));
    }else if(wk==='ice'){
      world.add(mk(cone(0.18,0.6,5),mat(0xdff3fa),x,0.1,zz,false));
    }else{
      const b=mk(sph(0.3,6,5),mat(0x2b2230),x,-0.08,zz,false);b.scale.set(1,0.6,1);world.add(b);
    }
  }
  lane.speed=Math.min(3.7,0.9+(lv<=12?lv*0.15:1.8+(lv-12)*0.012)+rand(0,0.7));
  const count=lv<=2?4:3, spacing=RING/count, base=rand(0,RING);
  for(let k=0;k<count;k++){
    let len,mesh,top,restY;
    if(wk==='ice'||wk==='lava'){
      len=turtles?irand(2,3)*1.1:Math.round(rand(2.2,3.8)*2)/2;
      const sl=makeSlab(len,wk);mesh=sl.mesh;top=sl.top;restY=sl.restY;
    }else if(turtles){
      const n=irand(2,3);len=n*1.1;mesh=new THREE.Group();
      const sc=wk==='swamp'?[0x4a6a3a,0x3a5a2c]:[0x6aa84f,0x4f8a3c];
      for(let j=0;j<n;j++){
        const cx=(j-(n-1)/2)*1.1;
        const shell=mk(sph(0.5,10,7),mat(sc[0]),cx,-0.05,0);shell.scale.set(1,0.35,0.85);mesh.add(shell);
        const mark=mk(sph(0.32,8,6),mat(sc[1]),cx,0.0,0);mark.scale.set(1,0.3,0.8);mesh.add(mark);
        mesh.add(mk(sph(0.14,8,6),mat(0xb7d66a),cx+0.52*lane.dir,-0.02,0));
      }
      top=0.12;restY=0;
    }else{
      len=Math.round(rand(2.2,3.8)*2)/2;
      const lc=wk==='swamp'?0x5b4b36:0x9a6a3a,mc=wk==='swamp'?0x4f7a3c:0x7a4f28;
      mesh=mk(geo('log'+len,()=>new THREE.CylinderGeometry(0.28,0.28,len,10).rotateZ(Math.PI/2)),mat(lc),0,-0.05,0);
      mesh.add(mk(sph(0.07,6,5),mat(mc),rand(-len/3,len/3),0.26,rand(-0.1,0.1),false));
      mesh.add(mk(sph(0.07,6,5),mat(mc),rand(-len/3,len/3),0.26,rand(-0.1,0.1),false));
      top=0.23;restY=-0.05;
    }
    mesh.position.set(0,restY,z);
    world.add(mesh);
    lane.objs.push({kind:turtles?'turtle':'log',len:len,p:base+k*spacing+rand(0,1.2),x:0,mesh:mesh,top:top,restY:restY,sink:0,ok:true,ph:rand(0,8),dive:turtles&&lv>=2,lane:lane});
  }
}

let coins=[],trailT=0;
const coinMat=new THREE.MeshLambertMaterial({color:0xffc83d,emissive:0x9a6400});
function spawnCoins(lv){
  const n=7+Math.min(lv,5);
  for(let k=0;k<n;k++){
    let x=0,z=0,ok=false;
    for(let tries=0;tries<12&&!ok;tries++){
      const li=irand(1,lanes.length-2),L=lanes[li];
      if(L.type==='river')continue;
      x=irand(-5,5);z=-li;ok=true;
      for(const o of obstacles){if(Math.hypot(o.x-x,o.z-z)<o.r+0.6){ok=false;break;}}
      for(const c of coins){if(Math.abs(c.x-x)<1&&c.z===z){ok=false;break;}}
    }
    if(!ok)continue;
    const m=new THREE.Mesh(geo('coin',()=>new THREE.CylinderGeometry(0.24,0.24,0.07,16).rotateX(Math.PI/2)),coinMat);
    m.castShadow=true;world.add(m);
    coins.push({m:m,x:x,z:z,alive:true,ph:rand(0,6)});
  }
}
function updateCoins(){
  for(const c of coins){
    if(!c.alive)continue;
    magnetPull(c);
    c.m.position.set(c.x,0.55+Math.sin(T*3+c.ph)*0.06,c.z);
    c.m.rotation.y=T*3+c.ph;
  }
}
function collectCoins(){
  if(frog.y>1.1)return;
  for(const c of coins){
    if(!c.alive)continue;
    if(Math.abs(c.x-frog.x)<0.55&&Math.abs(c.z-frog.z)<0.55){
      c.alive=false;world.remove(c.m);
      gainCoins(5);buzz(8);flyCoin(c.x,0.6,c.z);
      popup('+5',c.x,1.0,c.z,'gold');
      burst(c.x,0.55,c.z,0xffc83d,5,2.2);
      tone(988,1319,0.1,'square',0.04);
    }
  }
}
function applySkin(id){
  P.skin=id;
  fillFrog(FB.inner,curSkin());
}
function skinFx(dt){
  const sk=curSkin();
  if(sk.rainbow){
    const M=skMats(sk),h=(T*0.3)%1;
    M.body.color.setHSL(h,0.85,0.56);M.dark.color.setHSL(h,0.85,0.4);
  }
  if(sk.trail||sk.rainbow){
    trailT-=dt;
    if(trailT<=0&&state==='play'&&Math.hypot(frog.vx,frog.vz)>1&&frog.grounded){
      trailT=0.08;
      burst(frog.x,0.14,frog.z,sk.rainbow?pick([0xff4a4a,0xffe03a,0x4fd13b,0x3fa8ff,0xb061ff]):sk.trail,1,0.5);
    }
  }
}
const bioFor=lv=>mode==='campaign'?Math.floor((lv-1)/PER)%BIOMES.length:lv-1;
function buildLevel(lv,bi){
  if(world)scene.remove(world);
  applyBiome(bi===undefined?bioFor(lv):bi);
  world=new THREE.Group();scene.add(world);
  lanes=[];flies=[];obstacles=[];bossClear();
  const Lx=Math.min(lv,12)-1;
  let r1=[2,2,3,3,3,3,3,3,4,4,4,4][Lx],w1=[2,2,2,3,3,3,3,4,3,4,4,4][Lx],r2=[1,2,2,2,3,3,3,3,3,4,4,4][Lx],w2=[1,2,2,2,2,3,3,3,4,3,4,4][Lx];
  if(lv>6){const j=v=>clamp(v+irand(-1,1),2,5);r1=j(r1);w1=j(w1);r2=j(r2);w2=j(w2);}
  const seq=['grass'];
  const add=(t,n)=>{for(let k=0;k<n;k++)seq.push(t);};
  add('road',r1);add('grass',1);add('river',w1);add('grass',1);add('road',r2);add('grass',1);add('river',w2);add('goal',1);
  let rivers=0;
  seq.forEach((type,i)=>{
    const lane={i:i,z:-i,type:type,dir:i%2===0?1:-1,speed:0,objs:[],shim:[]};
    lanes.push(lane);
    if(type==='grass'||type==='goal')buildGrass(lane);
    else if(type==='road')buildRoad(lane,seq,lv);
    else buildRiver(lane,lv,rivers++);
  });
  const n=4+Math.min(lv,4);
  for(let k=0;k<n;k++)addFly(false);
  if(Math.random()<0.7)addFly(true);
  coins=[];spawnCoins(lv);itemsReset();spawnLevelCrates(lv);
  buildTrack();
}

    stamina:100,dashT:0,tongueT:-1,tongueFly:null,deadT:0,deadType:'',phase:0,squash:0});

}

/* ---------- Parçacıklar ve ekran yazıları ---------- */
function burst(x,y,z,color,n,speed){
  for(let k=0;k<n;k++){
    const m=new THREE.Mesh(sph(0.07,6,5),mat(color));
    m.position.set(x,y,z);scene.add(m);
    const a=rand(0,Math.PI*2),s=rand(0.4,1)*speed;
    parts.push({m:m,vx:Math.cos(a)*s,vy:rand(2.5,5),vz:Math.sin(a)*s,life:rand(0.6,1)});
  }
}
function ripple(x,z,y){
  const m=new THREE.Mesh(geo('ripple',()=>new THREE.RingGeometry(0.2,0.3,24).rotateX(-Math.PI/2)),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.8,depthWrite:false}));
  m.position.set(x,y===undefined?-0.1:y,z);scene.add(m);rings.push({m:m,t:0});
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.vy-=14*dt;
    p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    p.life-=dt;const s=Math.max(0.01,Math.min(1,p.life*2));p.m.scale.set(s,s,s);
    if(p.life<=0||p.m.position.y<-0.6){scene.remove(p.m);parts.splice(i,1);}
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.t+=dt;const s=1+r.t*5;
    r.m.scale.set(s,1,s);r.m.material.opacity=Math.max(0,0.8*(1-r.t/0.8));
    if(r.t>0.8){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1);}
  }
}
const _v=new THREE.Vector3();
function popup(text,x,y,z,cls){
  _v.set(x,y,z).project(camera);
  const d=document.createElement('div');
  d.className='pop '+(cls||'');d.textContent=text;
  d.style.left=((_v.x*0.5+0.5)*canvas.clientWidth)+'px';
  d.style.top=((-_v.y*0.5+0.5)*canvas.clientHeight)+'px';
  $('pops').appendChild(d);
  setTimeout(()=>{d.remove();},1050);
}
function banner(t,s){
  const b=$('banner');
  $('bnT').textContent=t;$('bnS').textContent=s||'';
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
}

const K={}, TK={up:false,down:false,left:false,right:false};
const B={jump:0,dash:0,tongue:0};
const BUF=0.18;
const mouse={x:0,y:0,active:false};
const JOY={id:-1,x:0,z:0,ox:0,oy:0};
let padMove={x:0,z:0},padAim=null,padPrev={};
function moveVec(){
  let x=0,z=0;
  if(K.KeyA||K.ArrowLeft||TK.left)x-=1;
  if(K.KeyD||K.ArrowRight||TK.right)x+=1;
  if(K.KeyW||K.ArrowUp||TK.up)z-=1;
  if(K.KeyS||K.ArrowDown||TK.down)z+=1;
  x+=padMove.x;z+=padMove.z;
  x+=JOY.x;z+=JOY.z;
  const m=Math.hypot(x,z);
  if(m>1){x/=m;z/=m;}
  return {x:x,z:z,m:m};
}
function pollPad(){
  padMove={x:0,z:0};padAim=null;
  let p=null;
  try{const ps=navigator.getGamepads?navigator.getGamepads():[];for(const q of ps){if(q&&q.connected){p=q;break;}}}catch(e){}
  if(!p)return;
  const dz=v=>Math.abs(v)<0.2?0:v;
  let mx=dz(p.axes[0]||0),mz=dz(p.axes[1]||0);
  const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
  if(b(14))mx=-1;if(b(15))mx=1;if(b(12))mz=-1;if(b(13))mz=1;
  padMove={x:mx,z:mz};
  const rx=p.axes[2]||0,rz=p.axes[3]||0;
  if(Math.hypot(rx,rz)>0.4){const m=Math.hypot(rx,rz);padAim={x:rx/m,z:rz/m};mouse.active=false;}
  const edge=(name,down)=>{const was=padPrev[name];padPrev[name]=down;return down&&!was;};
  if(edge('a',b(0)))B.jump=BUF;
  if(edge('x',b(2)||b(5)||b(7)))B.tongue=BUF;
  if(edge('b',b(1)||b(4)))B.dash=BUF;
  if(edge('s',b(9)))togglePause();
}
const ray=new THREE.Raycaster(), plane=new THREE.Plane(new THREE.Vector3(0,1,0),-0.3), hit=new THREE.Vector3(), ndc=new THREE.Vector2();
const aim={x:0,z:-1,d:REACH};
function computeAim(){
  if(padAim){aim.x=padAim.x;aim.z=padAim.z;aim.d=REACH;return;}
  if(mouse.active){
    ndc.set(mouse.x,mouse.y);ray.setFromCamera(ndc,camera);
    if(ray.ray.intersectPlane(plane,hit)){
      const dx=hit.x-frog.x,dz=hit.z-frog.z,d=Math.hypot(dx,dz);
      if(d>0.12){aim.x=dx/d;aim.z=dz/d;aim.d=d;return;}
    }
  }
  aim.x=frog.face.x;aim.z=frog.face.z;aim.d=REACH;
}
function setMouse(e){
  if(e.pointerId===JOY.id)return;
  const r=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  mouse.active=true;
}
canvas.addEventListener('pointermove',setMouse);

/* ---------- Yetenekler ---------- */
function doJump(mv){
  const L=frog.log?frog.log.lane:null;
  frog.carryX=(L?L.dir*L.speed:(frog.swimming?laneAt(frog.z).dir*laneAt(frog.z).speed*0.45:0))*laneScale;
  frog.vy=JUMP_V;frog.grounded=false;frog.jumpCd=JUMP_CD;frog.log=null;frog.swimming=false;
  if(mv.m<0.1){frog.vx=frog.face.x*WALK*1.2;frog.vz=frog.face.z*WALK*1.2;}
  emit('jump');tone(260,820,0.2,'triangle',0.07);
  burst(frog.x,Math.max(0,frog.y),frog.z,0xdddddd,5,1.6);
}
function doDash(mv){
  emit('dash');
  frog.dashDir=mv.m>0.1?{x:mv.x/Math.hypot(mv.x,mv.z),z:mv.z/Math.hypot(mv.x,mv.z)}:{x:frog.face.x,z:frog.face.z};
  frog.dashT=DASH_T;frog.dashCd=DASH_CD;
  frog.face={x:frog.dashDir.x,z:frog.dashDir.z};
  frog.targetAngle=Math.atan2(-frog.face.x,-frog.face.z);
  tone(500,1000,0.14,'sawtooth',0.04);
  burst(frog.x,Math.max(0,frog.y)+0.1,frog.z,0x9fe9f7,6,2);
}
function findFly(dx,dz,any){
  let bf=null,bd=1e9;
  // 1) dar koni
  for(const fl of flies){
    if(!fl.alive)continue;
    const rx=fl.x-frog.x,rz=fl.z-frog.z;
    const along=rx*dx+rz*dz,lat=Math.abs(rx*dz-rz*dx);
    if(along>0.25&&along<REACH+0.3&&lat<0.5+along*0.07&&along<bd){bd=along;bf=fl;}
  }
  if(bf)return {fly:bf,d:bd,dx:dx,dz:dz};
  // 2) yardımlı geniş koni (hedefe otomatik kilitlenir)
  let bs=1e9;
  for(const fl of flies){
    if(!fl.alive)continue;
    const rx=fl.x-frog.x,rz=fl.z-frog.z,dist=Math.hypot(rx,rz);
    const along=rx*dx+rz*dz,lat=Math.abs(rx*dz-rz*dx);
    if(along>0.1&&dist<REACH+0.4&&lat<1.1+along*0.3){const sc=dist+lat*2;if(sc<bs){bs=sc;bf=fl;bd=dist;}}
  }
  if(!bf&&any){ // 3) yön fark etmez: en yakın sinek
    for(const fl of flies){
      if(!fl.alive)continue;
      const dist=Math.hypot(fl.x-frog.x,fl.z-frog.z);
      if(dist<REACH+0.4&&dist<bs){bs=dist;bf=fl;bd=dist;}
    }
  }
  if(!bf)return null;
  const ux=(bf.x-frog.x)/(bd||1),uz=(bf.z-frog.z)/(bd||1);
  return {fly:bf,d:bd,dx:ux,dz:uz};
}
function useTongue(){
  emit('tongue');
  computeAim();
  frog.tongueCd=TONGUE_CD;frog.tongueT=0;frog.tongueHit=false;
  const sup=superN>0;if(sup){superN--;renderItems();}
  frog.tongueSuper=sup;
  const f=findFly(aim.x,aim.z,!mouse.active||sup);
  const ax=f?f.dx:aim.x,az=f?f.dz:aim.z;
  frog.tongueDir={x:ax,z:az};
  frog.tongueFly=f?f.fly:null;
  frog.tongueLen=f?Math.max(0.4,f.d-0.4):REACH*(sup?1.6:1);
  frog.targetAngle=Math.atan2(-ax,-az);
  tone(900,300,0.12,'sawtooth',0.035);
}
function eatFly(fl){
  fl.alive=false;emit('fly');
  const px=fl.x,pz=fl.z;
  if(fl.gold){
    emit('gold');
    if(lives<5){lives++;popup(t('p_life'),px,1.2,pz,'gold');}else{addScore(300);popup('+300',px,1.2,pz,'gold');}
    gainCoins(25);P.st.flies++;
    frog.jumpCd=0;frog.dashCd=0;frog.tongueCd=0;frog.stamina=100;
    tone(700,1500,0.25,'triangle',0.07);
  }else{
    addScore(50);gainCoins(2);P.st.flies++;frog.stamina=Math.min(100,frog.stamina+25);
    popup('+50',px,1.1,pz);tone(600,1200,0.12,'square',0.045);
  }
  updateHUD();
}

  if(type==='car'&&shieldT>0){shieldT=0;frog.invul=1.6;buzz(40);burst(frog.x,0.5,frog.z,0x6fc4ff,16,4);tone(700,200,0.25,'triangle',0.08);shakeT=Math.max(shakeT,0.2);renderItems();return;}
  state='dying';frog.deadT=0;frog.deadType=type;frog.invul=0;
  lives--;buzz(70);updateHUD();bossOnDie();
  frog.vx=frog.vz=0;frog.log=null;frog.dashT=0;frog.tongueT=-1;tongueG.visible=false;
  clearBuffers();
  if(type==='car'){burst(frog.x,0.3,frog.z,0x4fd13b,12,4);tone(180,40,0.35,'sawtooth',0.1);shakeT=0.45;}
  else if(type==='lava'){burst(frog.x,0.1,frog.z,0xff7a2a,18,3.5);burst(frog.x,0.1,frog.z,0xffd24a,8,2.5);tone(320,50,0.5,'sawtooth',0.08);shakeT=0.3;}
  else{burst(frog.x,-0.05,frog.z,0xbfeaf5,16,3.5);ripple(frog.x,frog.z);tone(500,80,0.4,'triangle',0.07);shakeT=0.2;}
}
function clearBuffers(){B.jump=B.dash=B.tongue=0;}
function updateDying(dt){
  frog.deadT+=dt;
  if(frog.deadType!=='car'){frog.y=Math.max(-0.7,frog.y-dt*0.6);}
  if(frog.deadT>1.15){
    if(lives<=0){if(!monRevive())gameOver();}
    else{resetFrog();frog.invul=1.8;frog.jumpCd=0;frog.dashCd=0;state='play';}
  }
}

/* ---------- Güncelleme ---------- */
function updateLanes(dt){
  LT+=dt*laneScale;
  if(BIO.wkind==='lava'){const e=0.75+0.2*Math.sin(T*2.3);lavaMats[0].emissiveIntensity=e;lavaMats[1].emissiveIntensity=e+0.1*Math.sin(T*3.1+1);}
  for(const L of lanes){
    for(const o of L.objs){
      o.x=wrap(o.p+L.dir*L.speed*LT);
      o.mesh.position.x=o.x;
      if(o.kind==='turtle'){
        const ph=(T+o.ph)%8;
        const diving=o.dive&&ph>6.0&&ph<7.5, shake=o.dive&&ph>5.0&&ph<=6.0;
        o.sink+=((diving?1:0)-o.sink)*Math.min(1,dt*7);
        o.ok=o.sink<0.45;
        o.mesh.position.y=o.restY-0.5*o.sink+(shake?Math.sin(T*40)*0.025:0);
      }
    }
    for(const s of L.shim)s.mesh.position.x=wrap(s.p+L.dir*0.35*T);
  }
  for(const c of clouds){c.g.position.x+=c.v*dt;if(c.g.position.x>50)c.g.position.x=-50;}
}
function updateFlies(){
  for(const fl of flies){
    if(!fl.alive)continue;
    const ph=T*2+fl.ph;
    fl.g.position.set(fl.x+Math.cos(ph)*0.18,0.75+Math.sin(T*5+fl.ph)*0.06,fl.z+Math.sin(ph)*0.18);
    const w=Math.sin(T*50+fl.ph)*0.7;
    fl.w1.rotation.z=w;fl.w2.rotation.z=-w;
    if(fl.halo){const s=1+0.15*Math.sin(T*6);fl.halo.scale.set(s,s,s);}
  }
}
function groundInfo(x,z){
  const L=laneAt(z);
  if(L.type!=='river')return {h:0,log:null,L:L};
  const m=frog.swimming?0.3:0.08;
  for(const o of L.objs){
    if(o.ok&&Math.abs(x-o.x)<o.len/2+m)return {h:o.top+(o.mesh.position.y-o.restY),log:o,L:L};
  }
  return {h:-0.16,log:null,L:L};
}
function setSurface(gi){
  const wasSw=frog.swimming;
  frog.log=gi.log;
  frog.swimming=gi.L.type==='river'&&!gi.log;
  if(frog.swimming&&!wasSw){if(BIO.wkind==='lava'){die('lava');return;}burst(frog.x,-0.05,frog.z,0xbfeaf5,6,2);ripple(frog.x,frog.z);tone(420,120,0.18,'triangle',0.05);}
}
function checkCars(){
  if(frog.invul>0||frog.y>0.8)return;
  const li=Math.round(-frog.z);
  for(let k=li-1;k<=li+1;k++){
    const L=lanes[k];
    if(!L||L.type!=='road'||Math.abs(frog.z-L.z)>0.54)continue;
    for(const o of L.objs){
      if(Math.abs(frog.x-o.x)<o.len/2+0.24){die('car');return;}
    }
  }
}
function updatePlay(dt){
  bossUpdate(dt);itemsUpdate(dt);
  frog.invul=Math.max(0,frog.invul-dt);
  frog.jumpCd=Math.max(0,frog.jumpCd-dt);
  frog.dashCd=Math.max(0,frog.dashCd-dt);
  frog.tongueCd=Math.max(0,frog.tongueCd-dt);
  for(const k in B)B[k]=Math.max(0,B[k]-dt);
  const mv=moveVec();

  if(B.jump>0&&frog.jumpCd<=0&&frog.grounded){doJump(mv);B.jump=0;}
  if(B.dash>0&&frog.dashCd<=0&&frog.dashT<=0){doDash(mv);B.dash=0;}
  if(B.tongue>0&&frog.tongueT<0&&frog.tongueCd<=0){useTongue();B.tongue=0;}

  // yatay hız
  if(frog.dashT>0){
    frog.dashT-=dt;frog.vx=frog.dashDir.x*DASH_V;frog.vz=frog.dashDir.z*DASH_V;
    if(frog.dashT<=0){frog.vx=frog.dashDir.x*WALK;frog.vz=frog.dashDir.z*WALK;}
  }else if(frog.grounded){
    const sp=(frog.swimming?SWIM:WALK*BIO.walk)*spdMul,k=1-Math.exp(-((frog.swimming||frog.log)?20:BIO.slip)*dt);
    frog.vx+=(mv.x*sp-frog.vx)*k;frog.vz+=(mv.z*sp-frog.vz)*k;
  }else if(mv.m>0.1){
    const k=1-Math.exp(-5*dt),sp=WALK*1.35;
    frog.vx+=(mv.x*sp-frog.vx)*k;frog.vz+=(mv.z*sp-frog.vz)*k;
  }
  frog.x+=(frog.vx+frog.carryX)*dt;
  frog.z+=frog.vz*dt;
  frog.z=clamp(frog.z,-(lanes.length-1)-0.4,0.4);
  for(const o of obstacles){
    if(Math.abs(o.z-frog.z)>1.2||frog.y>o.h)continue;
    const dx=frog.x-o.x,dz=frog.z-o.z,d=Math.hypot(dx,dz),mn=o.r+0.27;
    if(d<mn&&d>0.001){frog.x=o.x+dx/d*mn;frog.z=o.z+dz/d*mn;}
  }

  // taşıma ve akıntı
  const Lh=laneAt(frog.z);
  if(frog.grounded){
    if(frog.log)frog.x+=frog.log.lane.dir*frog.log.lane.speed*dt*laneScale;
    else if(frog.swimming)frog.x+=Lh.dir*Lh.speed*0.45*dt*laneScale;
  }
  if(Lh.type==='river'&&frog.grounded){
    if(Math.abs(frog.x)>XMAX){die('swept');return;}
  }else frog.x=clamp(frog.x,-XMAX,XMAX);

  // dikey
  const gi=groundInfo(frog.x,frog.z);
  if(frog.grounded){
    if(frog.y>gi.h+0.06){frog.grounded=false;frog.vy=0;frog.carryX=0;}
    else{frog.y+=(gi.h-frog.y)*Math.min(1,dt*18);setSurface(gi);}
  }
  if(!frog.grounded){
    frog.vy-=G*dt;frog.y+=frog.vy*dt;
    if(frog.y<=gi.h&&frog.vy<=0){
      const fall=-frog.vy;
      frog.y=gi.h;frog.vy=0;frog.grounded=true;frog.carryX=0;
      frog.squash=clamp(fall*0.03,0.05,0.3);
      setSurface(gi);
      if(fall>5&&!frog.swimming)burst(frog.x,0.05,frog.z,0xdddddd,5,1.8);
    }
    if(Lh.type==='river'&&Math.abs(frog.x)>XMAX+1.5){die('swept');return;}
  }

  // yüzme enerjisi
  if(frog.swimming){
    frog.stamina-=34*dt*BIO.drain;
    frog.rippleT-=dt;if(frog.rippleT<=0&&Math.hypot(frog.vx,frog.vz)>0.5){ripple(frog.x,frog.z);frog.rippleT=0.28;}
    if(frog.stamina<=0){frog.stamina=0;die('water');return;}
  }else frog.stamina=Math.min(100,frog.stamina+25*dt);

  // yön
  if(frog.tongueT>=0){frog.targetAngle=Math.atan2(-frog.tongueDir.x,-frog.tongueDir.z);}
  else if(frog.dashT<=0&&mv.m>0.1){
    const l=Math.hypot(mv.x,mv.z);frog.face={x:mv.x/l,z:mv.z/l};
    frog.targetAngle=Math.atan2(-frog.face.x,-frog.face.z);
  }

  // ilerleme ve hedef
  const li=Math.round(-frog.z);
  if(frog.grounded&&li>maxLane){emit('lane',li-maxLane);addScore(10*(li-maxLane));maxLane=li;}
  if(frog.grounded&&li===lanes.length-1&&!bossBlocksGoal()){winLevel();return;}
  collectCoins();
  checkCars();
}
function updateTongue(dt){
  if(frog.tongueT<0){tongueG.visible=false;return;}
  frog.tongueT+=dt;
  const EXT=0.13,RET=0.17,t=frog.tongueT;
  let len;
  if(t<EXT){len=frog.tongueLen*(t/EXT);}
  else{
    if(!frog.tongueHit){frog.tongueHit=true;bossTongue();if(frog.tongueFly&&frog.tongueFly.alive)eatFly(frog.tongueFly);}
    const r=(t-EXT)/RET;
    if(r>=1){
      frog.tongueT=-1;tongueG.visible=false;
      if(frog.tongueFly){world.remove(frog.tongueFly.g);frog.tongueFly=null;}
      return;
    }
    len=frog.tongueLen*(1-r);
  }
  const d=frog.tongueDir;
  tongueG.visible=true;
  tongueG.position.set(frog.x+d.x*0.4,frog.y+0.33,frog.z+d.z*0.4);
  tongueG.rotation.y=Math.atan2(-d.x,-d.z);
  tongueM.scale.z=Math.max(0.001,len);
  tipM.position.z=-len;
  const fl=frog.tongueFly;
  if(fl&&frog.tongueHit)fl.g.position.set(frog.x+d.x*(0.4+len),frog.y+0.33,frog.z+d.z*(0.4+len));
}
function applyFrog(dt){
  const f=frog;
  const d=((f.targetAngle-f.angle+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  f.angle+=d*Math.min(1,dt*18);
  f.root.position.set(f.x,f.y,f.z);
  f.root.rotation.y=f.angle;
  let sx=1,sy=1,sz=1,bob=0;
  const sp=Math.hypot(f.vx,f.vz);
  if(state==='dying'){
    if(f.deadType==='car'){const k=Math.min(1,f.deadT*8);sx=1+0.5*k;sy=1-0.88*k;sz=1+0.4*k;}
    else{const k=Math.min(1,f.deadT/0.9);sx=sy=sz=1-0.7*k;}
  }else if(state==='play'){
    if(!f.grounded){const s=clamp(f.vy*0.02,-0.15,0.28);sy=1+s;sx=sz=1/Math.sqrt(sy);}
    else if(sp>0.6&&f.dashT<=0){
      f.phase+=sp*dt*2.6;
      const p=Math.abs(Math.sin(f.phase));
      bob=p*(f.swimming?0.03:0.11);sy=1+0.1*p;sx=sz=1-0.04*p;
    }else sy=1+0.03*Math.sin(T*3);
    if(f.squash>0){sy*=1-f.squash;sx*=1+f.squash*0.5;sz*=1+f.squash*0.5;f.squash=Math.max(0,f.squash-dt*0.9);}
  }
  f.inner.position.y=bob;
  f.inner.scale.set(sx,sy,sz);
  f.ring.visible=f.dashT>0;
  f.root.visible=state==='menu'?(curView==='home'):(f.invul>0?(Math.floor(T*14)%2===0):true);

  // nişan halkası
  const show=state==='play'&&!paused&&(mouse.active||padAim);
  if(show){
    computeAim();
    const dist=Math.min(aim.d,REACH);
    reticle.position.set(frog.x+aim.x*dist,0.06,frog.z+aim.z*dist);
    const target=findFly(aim.x,aim.z);
    const ready=frog.tongueCd<=0;
    reticle.material.color.setHex(target?0xff6f9c:0xffffff);
    reticle.material.opacity=ready?0.9:0.3;
    const s=target?1.25+0.1*Math.sin(T*10):1;reticle.scale.set(s,1,s);
    reticle.visible=true;
    aimLine.position.set(frog.x,0.05,frog.z);
    aimLine.rotation.y=Math.atan2(-aim.x,-aim.z);
    aimLine.scale.z=Math.max(0.01,dist);
    aimLine.visible=true;
  }else{reticle.visible=false;aimLine.visible=false;}
}
const camPos=new THREE.Vector3(0,9,9), camLook=new THREE.Vector3(0,0,-3);
const _tp=new THREE.Vector3(), _tl=new THREE.Vector3();
function updateCamera(dt){
  let rate;
  if(state==='menu'){
    const asp=camera.aspect,wide=asp>1.1,off=wide?clamp((asp-1)*1.1,0.4,2.1):0,sw=Math.sin(T*0.35)*0.3;
    _tp.set(-0.1+sw,wide?2.3:3.8,wide?-1.9:0.9);
    _tl.set(off,wide?0.8:1.3,-6);rate=3;
  }else{
    const cz=camDist*camZoom;
    _tp.set(frog.x*0.3,cz*0.74,frog.z+cz*0.67);
    _tl.set(frog.x*0.3,0,frog.z-cz*0.2);
    rate=T<camBoost?2.5:7;
  }
  const k=1-Math.exp(-rate*dt);
  camPos.lerp(_tp,k);camLook.lerp(_tl,k);
  camera.position.copy(camPos);
  if(shakeT>0&&S.shake){
    shakeT-=dt;const a=shakeT*0.35;
    camera.position.x+=(Math.random()-0.5)*a;camera.position.y+=(Math.random()-0.5)*a;
  }
  camera.lookAt(camLook);
  sun.position.set(camLook.x+8,18,camLook.z+7);
  sun.target.position.set(camLook.x,0,camLook.z);
  sun.target.updateMatrixWorld();
}
function update(dt){
  T+=dt;
  pollPad();
  updateLanes(dt);
  updateFlies();updateCoins();skinFx(dt);
  if(state==='play')updatePlay(dt);
  else if(state==='dying')updateDying(dt);
  else if(state==='win')updateWin(dt);
  updateTongue(dt);
  applyFrog(dt);
  menuFrog(dt);
  updateParts(dt);
  updateCamera(dt);
  updateAmbient(dt,camLook.x,camLook.z);
}

/* ---------- Paket açma ---------- */
function rollRar(w){let s=0;w.forEach(v=>{s+=v;});let r=Math.random()*s;for(let i=0;i<4;i++){r-=w[i];if(r<0)return i;}return 3;}
function rollSkinOf(r){
  const pool=SKINS.filter(s=>s.r===r),un=pool.filter(s=>!P.owned[s.id]);
  return pick(un.length&&Math.random()<0.75?un:pool);
}
function rollPack(pd){
  const rs=[];
  for(let i=0;i<pd.n;i++)rs.push(rollRar(pd.w));
  if(Math.max.apply(null,rs)<pd.min)rs[irand(0,pd.n-1)]=pd.min;
  rs.sort((a,b)=>a-b);
  return rs.map(r=>({sk:rollSkinOf(r),dup:false,refund:0,flip:false}));
}
let pk=null,packOrigin='shop';
function buyPack(pid,free,origin){
  const pd=PACKS.find(p=>p.id===pid);
  if(!free){
    if(P.coins<pd.price){toast(t('no_coin'));tone(200,120,0.15,'square',0.05);return;}
    P.coins-=pd.price;
  }
  P.st.packs++;emit('pack');
  const cards=rollPack(pd);
  cards.forEach(c=>{
    if(P.owned[c.sk.id]){c.dup=true;c.refund=REFUND[c.sk.r];P.coins+=c.refund;P.owned[c.sk.id]++;}
    else P.owned[c.sk.id]=1;
  });
  saveNow();updateWallet();
  pk={pd:pd,cards:cards,free:!!free,phase:'closed'};
  packOrigin=origin||'shop';
  const big=$('pkBig');
  big.className='pkbig pk-'+pd.id;
  big.innerHTML=PACK_EMBLEM+'<b>'+t('pk_'+pd.id)+'</b><span>×'+pd.n+'</span>';
  big.hidden=false;
  $('pkCards').hidden=true;$('pkCards').innerHTML='';
  $('pkBtns').hidden=true;
  $('pkHint').textContent=t('pk_tap');
  $('pack').hidden=false;
  big.focus();
  tone(300,500,0.2,'triangle',0.05);
}

function boot(){
  const L=$('loader');
  if(/[?&](debug|noload)/.test(location.search)){L.hidden=true;return;}
  const MIN=2.4,t0=performance.now();
  const tips=['ld_t1','ld_t2','ld_t3','ld_t4','ld_t5'];
  let ti=irand(0,tips.length-1),real=0,ready=false,shown=0,go=false;
  $('ldTip').textContent=t(tips[ti]);
  const tipI=setInterval(()=>{ti=(ti+1)%tips.length;$('ldTip').textContent=t(tips[ti]);},2600);
  const steps=[['ld_fonts',()=>Promise.race([document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))])]];
  SKINS.forEach(sk=>steps.push(['ld_skins',()=>skinThumb(sk)]));
  steps.push(['ld_world',()=>{try{renderer.compile(scene,camera);}catch(e){}}]);
  (async()=>{
    for(let i=0;i<steps.length;i++){
      $('ldMsg').textContent=t(steps[i][0]);
      try{await steps[i][1]();}catch(e){}
      real=(i+1)/steps.length;
      await new Promise(r=>setTimeout(r,20));
    }
    freeThumbs();real=1;ready=true;
  })();
  const fill=$('ldFill'),bar=L.querySelector('.ldbar');
  const iv=setInterval(()=>{
    const target=Math.min(real,(performance.now()-t0)/1000/MIN);
    shown+=(target-shown)*0.25;
    if(target>=1&&shown>0.995)shown=1;
    fill.style.width=Math.round(shown*100)+'%';
    bar.setAttribute('aria-valuenow',Math.round(shown*100));
    if(shown>=1&&ready&&!go){
      go=true;clearInterval(iv);clearInterval(tipI);
      $('ldMsg').textContent='';
      $('ldGo').hidden=false;$('ldGo').focus();
    }
  },50);
  $('ldGo').addEventListener('click',()=>{
    if(!go)return;
    go=false;audio();tone(500,1000,0.15,'triangle',0.06);
    L.classList.add('out');
    setTimeout(()=>{L.hidden=true;},550);
    refreshHome();
    if(dailyState().can)showView('daily');
  });
}

const joyEl=document.createElement('div');
joyEl.id='joy';joyEl.hidden=true;joyEl.innerHTML='<i class="jb"></i><i class="jk"></i>';
document.body.appendChild(joyEl);
const JR=62;
function joyShow(on){joyEl.hidden=!on;}
function joyPlace(bx,by,kx,ky){
  joyEl.children[0].style.transform='translate('+bx+'px,'+by+'px)';
  joyEl.children[1].style.transform='translate('+kx+'px,'+ky+'px)';
}
function joyStart(e){
  JOY.id=e.pointerId;JOY.ox=e.clientX;JOY.oy=e.clientY;JOY.x=JOY.z=0;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  joyPlace(JOY.ox,JOY.oy,JOY.ox,JOY.oy);joyShow(true);
}
function joyMove(e){
  if(e.pointerId!==JOY.id)return;
  let dx=e.clientX-JOY.ox,dy=e.clientY-JOY.oy,d=Math.hypot(dx,dy);
  if(d>JR){ // taban parmağı takip eder: yön değiştirmek kolay olur
    const k=(d-JR)/d;JOY.ox+=dx*k;JOY.oy+=dy*k;dx=e.clientX-JOY.ox;dy=e.clientY-JOY.oy;d=Math.hypot(dx,dy);
  }
  let m=clamp(d/(JR*0.8),0,1);
  m=m<0.12?0:Math.min(1,(m-0.12)/0.5);
  JOY.x=d>0?dx/d*m:0;JOY.z=d>0?dy/d*m:0;
  joyPlace(JOY.ox,JOY.oy,JOY.ox+dx,JOY.oy+dy);
}
function joyEnd(e){
  if(e&&e.pointerId!==JOY.id)return;
  JOY.id=-1;JOY.x=JOY.z=0;joyShow(false);
}
window.addEventListener('pointermove',joyMove);
window.addEventListener('pointerup',joyEnd);
window.addEventListener('pointercancel',joyEnd);

    desert:{bpm:110,root:57,sc:SC.phr,ch:[0,0,-2,0],lead:[[0,-1,1,-1,2,-1,1,0,-1,-1,3,-1,2,1,0,-1],[2,-1,3,-1,4,3,2,-1,1,-1,0,-1,1,-1,-1,-1]],lw:'sawtooth',bw:'triangle',kick:[0,8,11],snare:[4,12],hat:[0,2,4,6,8,10,12,14],lv:0.15,arp:0},
    ice:{bpm:92,root:64,sc:SC.maj,ch:[0,-5,-3,-7],lead:[[4,-1,-1,2,-1,-1,0,-1,-1,2,-1,-1,4,-1,5,-1],[5,-1,-1,4,-1,-1,2,-1,-1,0,-1,-1,2,-1,-1,-1]],lw:'sine',bw:'sine',kick:[0,10],snare:[8],hat:[4,12],lv:0.55,arp:2},
    swamp:{bpm:84,root:55,sc:SC.min,ch:[0,-2,-5,-4],lead:[[0,-1,-1,2,-1,3,-1,-1,2,-1,0,-1,-1,-1,1,-1],[3,-1,-1,2,-1,1,-1,-1,0,-1,-1,-1,2,-1,-1,-1]],lw:'triangle',bw:'sawtooth',kick:[0,7,10],snare:[8],hat:[2,6,10,14],lv:0.22,arp:0},
    lava:{bpm:134,root:52,sc:SC.min,ch:[0,0,-4,-2],lead:[[0,0,-1,2,-1,3,-1,4,3,-1,2,-1,0,-1,2,-1],[4,-1,4,3,-1,2,-1,0,-1,0,2,-1,3,-1,2,-1]],lw:'sawtooth',bw:'sawtooth',kick:[0,4,8,12],snare:[4,12],hat:[2,6,10,14],lv:0.15,arp:1},

  };
  function ensure(){
    if(!AC)return false;
    if(!mg){mg=AC.createGain();mg.connect(master);vol();
      const n=AC.sampleRate*0.5,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);

  }

  function note(f,t,dur,type,v,dest){
    const o=AC.createOscillator(),g=AC.createGain();

  }
  function drum(kind,t,dest){
    if(kind==='k'){

      o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
      g.gain.setValueAtTime(0.55,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.16);

      const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
      s.buffer=noiseB;f.type=kind==='s'?'bandpass':'highpass';f.frequency.value=kind==='s'?1800:7000;
      g.gain.setValueAtTime(kind==='s'?0.22:0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+(kind==='s'?0.12:0.04));

    }
  }
  function sched(){
    const T0=TR[cur];if(!T0||!tg)return;
    const sp=60/T0.bpm/4;
    while(nextT<AC.currentTime+0.2){
      const s=step%16,b=Math.floor(step/16),cr=T0.ch[b%T0.ch.length],rt=T0.root+cr,t=nextT;
      if(T0.kick.indexOf(s)>=0)drum('k',t,tg);
      if(T0.snare.indexOf(s)>=0)drum('s',t,tg);
      if(T0.hat.indexOf(s)>=0)drum('h',t,tg);
      if(s===0||s===6||s===8||s===12){note(mid(rt-12),t,sp*(s===0?5:3),T0.bw,0.30,tg);}

  function sync(){
    if(!AC)return;
    if(!ensure())return;
    duck=(paused||(menuOpen()&&state!=='menu'))?0.3:1;
    vol();
    play(want());
  }
  setInterval(sched,60);
  setInterval(sync,350);
  document.addEventListener('visibilitychange',()=>{
    if(!AC)return;
    try{if(document.hidden)AC.suspend();else AC.resume();}catch(e){}
  });
  return {sync:sync,vol:vol,play:play,get cur(){return cur;}};
})();

function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ensureQ(){
  const today=dstr(new Date());
  if(P.q&&P.q.day===today&&P.q.items&&P.q.items.length)return P.q;
  const rnd=mulb(hashStr(today)),pool=QP.slice(),items=[];
  while(items.length<3){
    const d=pool.splice(Math.floor(rnd()*pool.length),1)[0];
    let g=d.g[0]+Math.floor(rnd()*(d.g[1]-d.g[0]+1));
    if(d.g[1]>=30)g=Math.max(d.g[0],Math.round(g/5)*5);
    items.push({id:d.id,g:g,n:0,c:0});
  }
  P.q={day:today,items:items,b:0};saveNow();
  return P.q;
}

   Şimdilik BOSS_AT boş: altyapı hazır, oyunda kapalı. Açmak için örn. BOSS_AT[5]='croc'. */
const BOSSES={}, BOSS_AT={};
let boss=null; const bossProj=[];
function defBoss(id,def){BOSSES[id]=def;}

function bossClear(){
  if(boss&&boss.group&&boss.group.parent)boss.group.parent.remove(boss.group);

  bossProj.length=0;bossBar.hidden=true;

function bossBegin(m,lv){

  else if(m==='campaign'&&BOSS_AT[lv])bossSpawn(BOSS_AT[lv],lv);

function bossSpawn(id,lv){
  const def=BOSSES[id];if(!def||!lanes.length)return;
  const g=new THREE.Group();world.add(g);
  const z=lanes[lanes.length-1].z;
  const hpv=Math.round(def.hp*(1+((lv||PER)/PER-1)*0.05));
  boss={id:id,def:def,mul:hpv/def.hp,hp:hpv,max:hpv,x:0,z:z,y:0,r:def.r||1.5,t:0,intro:2.2,flash:0,phase:0,group:g,dead:false,open:false,data:{}};
  def.build(g,{mk:mk,box:box,sph:sph,cyl:cyl,cone:cone,mat:mat});

function bossTongue(){

  const d=frog.tongueDir,len=frog.tongueLen;

  if(Math.hypot(tx-boss.x,tz-boss.z)<boss.r+0.5){
