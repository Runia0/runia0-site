<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DEMO · NIGHT SHIFT: Son Vardiya</title>
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #05080f; color: #e9edf5;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: none; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; }
.zone { position: absolute; top: 0; bottom: 0; width: 50%; touch-action: none; }
#zone-move { left: 0; } #zone-look { right: 0; }
.left-handed #zone-move { left: auto; right: 0; } .left-handed #zone-look { right: auto; left: 0; }

#joy { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06);
  opacity: 0; pointer-events: none; transition: opacity .12s; }
#joy.show { opacity: 1; }
#joy-knob { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; border-radius: 50%;
  background: rgba(255,255,255,.5); transform: translate(-50%,-50%); }

#objective { position: absolute; top: 12px; left: 12px; max-width: 56%; padding: 8px 12px; border-radius: 10px;
  background: rgba(8,12,20,.62); border-left: 3px solid #f2b632; pointer-events: none; }
#objective-label { display: block; font-size: 10px; letter-spacing: .14em; color: #f2b632; font-weight: 700; }
#objective-text { font-size: 15px; font-weight: 600; }
#btn-pause { position: absolute; top: 12px; right: 12px; width: 54px; height: 54px; border-radius: 12px;
  background: rgba(8,12,20,.62); display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: center; }
#btn-pause span { width: 18px; height: 2px; background: #e9edf5; border-radius: 2px; }
#inv { position: absolute; top: 66px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 60%; pointer-events: none; }
.chip { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: rgba(8,12,20,.62); border: 1px solid rgba(255,255,255,.16); }
#toast { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); max-width: 84%; padding: 9px 14px; border-radius: 10px;
  background: rgba(8,12,20,.8); font-size: 15px; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.show { opacity: 1; }

#actions { position: absolute; right: 14px; bottom: 18px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.left-handed #actions { right: auto; left: 14px; align-items: flex-start; }
.actrow { display: flex; gap: 10px; }
.act { min-width: 62px; height: 62px; padding: 0 8px; border-radius: 50%; background: rgba(8,12,20,.55);
  border: 1.5px solid rgba(255,255,255,.3); font-size: 10.5px; font-weight: 700; letter-spacing: .05em; }
.act:active { background: rgba(255,255,255,.25); }
.act.on { background: rgba(242,182,50,.85); color: #14100a; border-color: #f2b632; }
.act.wide { border-radius: 16px; height: 56px; min-width: 150px; padding: 0 18px; font-size: 15px; letter-spacing: 0;
  background: rgba(242,182,50,.92); color: #14100a; border-color: #f2b632; }

/* ---------- Menü ve okuyucu ---------- */
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px;
  background: linear-gradient(180deg, rgba(5,8,15,.35), rgba(5,8,15,.8)); overflow: auto; touch-action: pan-y; }
.overlay.dim { background: rgba(5,8,15,.78); }
.panel { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.title h1 { margin: 0; font-size: clamp(38px, 12vw, 58px); letter-spacing: .08em; font-weight: 800; line-height: 1; text-wrap: balance; }
.title p { margin: 8px 0 10px; letter-spacing: .5em; font-size: 13px; color: #f2b632; font-weight: 700; }
h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: .04em; }
.col { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
.col.wide { max-width: 380px; }
.mbtn { height: 50px; border-radius: 12px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
  font-size: 16px; font-weight: 600; padding: 0 18px; touch-action: manipulation; }
.mbtn.primary { background: #f2b632; color: #14100a; border-color: #f2b632; }
.mbtn.ghost { background: transparent; }
.mbtn.small { height: 38px; font-size: 14px; padding: 0 12px; }
.mbtn:disabled { opacity: .35; cursor: default; }
.mbtn:active:not(:disabled) { filter: brightness(1.2); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; padding: 10px 12px;
  border-radius: 12px; background: rgba(255,255,255,.07); min-height: 54px; }
.row small { display: block; opacity: .7; font-size: 12px; margin-top: 2px; }
.rowbtns { display: flex; gap: 6px; }
.row select, .row input[type=range] { width: 46%; height: 36px; font: inherit; touch-action: manipulation; }
.row select { background: #121824; color: #e9edf5; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 0 8px; }
.row input[type=checkbox] { width: 24px; height: 24px; }
.foot { margin: 4px 0 0; font-size: 12px; opacity: .65; min-height: 16px; }
.body { font-size: 14px; line-height: 1.6; opacity: .9; margin: 0; }
#reader { background: rgba(5,8,15,.8); }
.paper { max-width: 360px; width: 100%; background: #e8e1cf; color: #2a241a; border-radius: 6px; padding: 22px 20px 18px;
  display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.paper p { margin: 0; white-space: pre-wrap; font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.55; }

@media (max-height: 430px) {
  .act { min-width: 54px; height: 54px; }
  .title h1 { font-size: 34px; } .mbtn { height: 42px; } .panel { gap: 8px; } .col { gap: 7px; }
}

/* ---------- Aşama 2: istatistik, telefon, kasa ---------- */
#btn-phone { position: absolute; top: 12px; right: 74px; width: 54px; height: 54px; border-radius: 12px; background: rgba(8,12,20,.62);
  display: flex; align-items: center; justify-content: center; }
#btn-phone i { width: 16px; height: 26px; border: 2px solid #e9edf5; border-radius: 4px; display: block; }
#stats { position: absolute; top: 74px; right: 12px; padding: 5px 10px; border-radius: 999px; background: rgba(8,12,20,.62);
  font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; pointer-events: none; white-space: nowrap; }
#progress { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); width: min(260px, 70%); height: 30px; border-radius: 8px;
  background: rgba(8,12,20,.8); overflow: hidden; pointer-events: none; }
#progress i { position: absolute; left: 0; top: 0; bottom: 0; background: #f2b632; }
#progress span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
  color: #fff; text-shadow: 0 1px 2px #000; }
.chip.carry { border-color: #f2b632; color: #f2b632; }
.overlay.sheet { background: rgba(5,8,15,.55); align-items: flex-end; padding: 0; }
.phone, .till { width: 100%; max-width: 460px; max-height: 88%; margin: 0 auto; background: #10151f; border-radius: 18px 18px 0 0;
  border: 1px solid rgba(255,255,255,.14); border-bottom: 0; display: flex; flex-direction: column; overflow: hidden; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; font-size: 14px;
  font-variant-numeric: tabular-nums; }
.phead b:first-child { flex: 1; }
.pclose { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.1); font-size: 16px; touch-action: manipulation; }
.ptabs { display: flex; gap: 6px; padding: 0 12px 10px; }
.ptab { flex: 1; height: 40px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 14px; font-weight: 600; touch-action: manipulation; }
.ptab.on { background: #f2b632; color: #14100a; }
.pbody { overflow-y: auto; padding: 0 12px 8px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.pbody h4 { margin: 8px 0 0; font-size: 11px; letter-spacing: .12em; color: #f2b632; text-transform: uppercase; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; min-height: 30px; }
.prow > span:first-child { opacity: .8; }
.pcard { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; background: #f2b632; }
.step { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.step b { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.step button { min-width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,.12); font-size: 16px; font-weight: 700; touch-action: manipulation; }
.step button.wide { font-size: 11.5px; font-weight: 600; padding: 0 8px; }
.pmsg { min-height: 30px; padding: 6px 14px 10px; font-size: 13px; color: #f2b632; }
.pnote { font-size: 12px; opacity: .6; margin: 6px 0; line-height: 1.5; }
.till { padding: 14px; gap: 10px; }
.till h3 { margin: 0; font-size: 17px; }
.clist { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; touch-action: pan-y; }
.citem { display: flex; justify-content: space-between; align-items: center; height: 46px; padding: 0 12px; border-radius: 10px;
  background: rgba(255,255,255,.1); font-size: 15px; touch-action: manipulation; }
.citem b { color: #f2b632; }
.citem.done { opacity: .55; } .citem.done b { color: #e9edf5; }
.ctotal { display: flex; justify-content: space-between; font-size: 17px; padding: 4px 2px; font-variant-numeric: tabular-nums; }
.chint { margin: 0; font-size: 13.5px; opacity: .85; }
.copts { display: flex; gap: 8px; } .copts .mbtn { flex: 1; padding: 0; }

/* ---------- Aşama 3-5: diyalog, kamera ---------- */
.dtext { margin: 0; white-space: pre-wrap; font-size: 15px; line-height: 1.55; max-height: 40vh; overflow-y: auto; touch-action: pan-y; }
.dopts { display: flex; flex-direction: column; gap: 8px; }
.dopts .mbtn { height: auto; min-height: 46px; padding: 8px 14px; font-size: 14.5px; }
.pbio { font-size: 12px; opacity: .7; line-height: 1.4; }
.ptab { font-size: 12.5px; }
#cctv { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 14px;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 120px rgba(0,0,0,.7); }
#cctv-label { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; color: #dfe; text-shadow: 0 0 4px #000; }
#cctv div { display: flex; gap: 8px; justify-content: flex-end; }

#sleep { position: absolute; inset: 0; background: #020306; display: flex; align-items: center; justify-content: center;
  font-size: 44px; font-weight: 300; letter-spacing: .1em; font-variant-numeric: tabular-nums; color: #cfd6e4; }
.wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wgrid .mbtn { height: 54px; padding: 0 6px; font-size: 14.5px; } .wgrid .mbtn.done { opacity: .4; }

/* ---------- Canlı arayüz: seviye, para yazıları ---------- */
#level { position: absolute; top: 106px; right: 12px; display: flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px;
  background: linear-gradient(90deg, #ff8a1f, #ffc928); color: #2a1600; font-size: 12px; pointer-events: none; }
#level span { width: 64px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.25); overflow: hidden; }
#level i { display: block; height: 100%; background: #fff; }
#stats { background: rgba(20,60,130,.82); }
#objective { background: rgba(20,60,130,.82); border-left-color: #ffc928; }
.pop { position: absolute; left: 50%; top: 46%; transform: translateX(-50%); font-size: 22px; font-weight: 800; color: #7dff8a;
  text-shadow: 0 2px 0 #0a3d12, 0 0 8px rgba(0,0,0,.5); pointer-events: none; animation: popUp 1.3s ease-out forwards; white-space: nowrap; }
@keyframes popUp { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
.act { border-color: rgba(255,255,255,.55); background: rgba(20,60,130,.6); }
.act.wide { background: linear-gradient(180deg, #ffd84a, #ffb01f); box-shadow: 0 4px 0 #b36b00; }
</style>

  <canvas id="view"></canvas>

    <div id="zone-move" class="zone"></div>

</div>
